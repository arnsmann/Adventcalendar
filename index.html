<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adventskalender">
<meta name="theme-color" content="#2b211d">
<title>Adventskalender für dich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@500;700&family=Fredoka:wght@400;500;600&family=Gochi+Hand&family=Nunito:wght@400;600;700&display=swap">
<style>
@font-face{font-family:"ArneFueller";src:url("schrift/fueller.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Arne";src:url("schrift/arne.woff2") format("woff2");font-display:swap}
/* Kugelschreiberschrift ist sehr fein: mit einem Umriss in Schriftfarbe etwas kräftiger machen */
.eyebrow,footer,.card .date,.note,.globe-hint,.welcome .feld,.song-head small{-webkit-text-stroke:var(--hand-dick,.03em) currentColor;paint-order:stroke fill}
</style>
<script>
/* Schrift zum Ausprobieren: ?schrift=1 bis 7, 9 = die alte von vorher, 0 = Standard (Arnes Handschrift). Die Wahl merkt sich der Browser. */
(function(){
  const S = {
    1: ["Fraunces:wght@500;700&family=Lora:wght@400;600;700&family=Caveat:wght@500;700", '"Fraunces",serif', '"Lora",serif', '"Caveat",cursive'],
    2: ["Playfair+Display:wght@500;700&family=Lora:wght@400;600;700&family=Dancing+Script:wght@500;700", '"Playfair Display",serif', '"Lora",serif', '"Dancing Script",cursive'],
    3: ["Mountains+of+Christmas:wght@400;700&family=Nunito:wght@400;600;700&family=Gochi+Hand", '"Mountains of Christmas",cursive', '"Nunito",sans-serif', '"Gochi Hand",cursive'],
    4: ["Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes", '"Cinzel Decorative",serif', '"Cormorant Garamond",serif', '"Great Vibes",cursive'],
    5: ["Amatic+SC:wght@400;700&family=Patrick+Hand&family=Caveat:wght@500;700", '"Amatic SC",cursive', '"Patrick Hand",cursive', '"Caveat",cursive'],
    // 6: Arnes eigene Handschrift. Fehlende Zeichen (Ziffern, Klammern, Bindestrich, Herz) kommen aus Gochi Hand.
    6: ["Gochi+Hand&family=Nunito:wght@400;600;700", '"Arne","Gochi Hand",cursive', '"Nunito",sans-serif', '"Arne","Gochi Hand",cursive'],
    // 9: die alte Schrift von vorher
    9: ["Dancing+Script:wght@500;700", '"Fredoka","Nunito",system-ui,sans-serif', '"Nunito",system-ui,sans-serif', '"Gochi Hand","Comic Sans MS",cursive', '"Dancing Script","Segoe Script",cursive'],
    // 7: Arnes Füllerschrift
    7: ["Caveat:wght@500;700&family=Nunito:wght@400;600;700", '"ArneFueller","Caveat",cursive', '"Nunito",sans-serif', '"ArneFueller","Caveat",cursive']
  };
  let n = (location.search.match(/schrift=(\d)/) || [])[1];
  try{ if(n !== undefined) localStorage.setItem("advent-schrift", n); else n = localStorage.getItem("advent-schrift"); }catch(e){}
  const f = S[n]; if(!f) return;
  if(n == 6){ const st = document.createElement("style"); st.textContent = '@font-face{font-family:"Arne";src:url("schrift/arne.woff2") format("woff2");font-display:swap}'; document.head.appendChild(st); }
  if(n == 7){ const st = document.createElement("style"); st.textContent = '@font-face{font-family:"ArneFueller";src:url("schrift/fueller.woff2") format("woff2");font-display:swap}'; document.head.appendChild(st); }
  const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + f[0] + "&display=swap"; document.head.appendChild(l);
  const r = document.documentElement.style; r.setProperty("--f-display", f[1]); r.setProperty("--f-body", f[2]); r.setProperty("--f-hand", f[3]); r.setProperty("--f-titel", f[4] || f[1]);
})();
</script>
<style>
/* Layout: Foto des Tages als Vollbild Hintergrund. Mittig eine nahe Ansicht der Treppe zu Hause (ein Bildschirm), die Tüten hängen am Edelstahlgeländer. */
:root{
  --ink:#4a3128; --soft:#8a6a5d; --board:#fff8f1; --berry:#c9566b; --pine:#3f6f57; --honey:#d9a441;
  --door-a:#f0c9c0; --door-b:#cfe0d2; --door-c:#f5ddb0; --door-d:#e7d3ea; --door-edge:rgba(90,58,49,.18); --inside:#3b2a24;
  --shadow:0 18px 50px rgba(20,10,5,.35);
  /* Arnes Handschrift: Überschriften mit Füller, kleine Texte mit Kugelschreiber. Fehlende Zeichen kommen aus Caveat bzw. Gochi Hand. */
  --f-display:"ArneFueller","Caveat","Gochi Hand",cursive;
  --f-titel:"ArneFueller","Caveat","Gochi Hand",cursive;
  --f-hand:"Arne","Gochi Hand","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#2b211d}
[hidden]{display:none!important}
body{background:#2b211d;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}

/* Fotohintergrund */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#5b4a42,#2b211d)}
.bg .layer,.view .layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}
.bg .layer.on,.view .layer.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,8,.3) 0,rgba(20,12,8,.22) 18%,rgba(20,12,8,.08) 32%,rgba(20,12,8,0) 45%)}

.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:16px 20px}
header{background:var(--board);border-radius:20px;padding:10px 22px 12px;box-shadow:var(--shadow);text-align:center;max-width:100%}
.eyebrow{font-family:var(--f-hand);font-size:1.15rem;color:var(--berry);line-height:1.1}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance}
.status{font-family:var(--f-display);font-size:.95rem;color:var(--soft);margin:4px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:#fff;border:2px dashed var(--door-edge);border-radius:999px;padding:1px 12px;color:var(--ink)}

/* Szene */
.scene{position:relative;width:min(100%,calc((100vh - 150px) * 1195 / 896),1500px);aspect-ratio:1195/896;
  border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#f1ece6}
.stage{position:absolute;inset:0;container-type:inline-size}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.view{position:absolute;overflow:hidden;background:linear-gradient(#a9bfd4,#e6dccb)}
#grid{position:absolute;inset:0}

/* Licht, Farbe und Textur über der Szene */
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shade{mix-blend-mode:multiply;z-index:5}
.tint{z-index:6;mix-blend-mode:soft-light;opacity:.5}
.tint rect{fill:var(--tint,#c9b28f);transition:fill 1.6s}
.glow{mix-blend-mode:screen;z-index:7}
.grain{mix-blend-mode:overlay;z-index:8}
#grid{z-index:4}
/* Licht aus: der Raum wird dunkel, die Fenster (durchsichtig im Bild) bleiben hell */
.nacht{position:absolute;inset:0;z-index:3;pointer-events:none;background:#232a52;mix-blend-mode:multiply;opacity:0;transition:opacity .9s ease;
  -webkit-mask:var(--raum-maske) 0 0/100% 100% no-repeat;mask:var(--raum-maske) 0 0/100% 100% no-repeat}
.licht-aus .nacht{opacity:.82}
/* die gemalten Lämpchen gehen wirklich aus: dort wird es grau statt gelb */
.lichter{position:absolute;inset:0;z-index:3;pointer-events:none;background:#3b3631;opacity:0;transition:opacity .5s ease;
  -webkit-mask:var(--licht-maske) 0 0/100% 100% no-repeat;mask:var(--licht-maske) 0 0/100% 100% no-repeat}
.licht-aus .lichter{opacity:.92}
.spots{position:absolute;inset:0;z-index:5;pointer-events:none}
/* Nikolaus (6. Dezember): gefüllter Stiefel an der Tür */
.stiefel{position:absolute;z-index:2;pointer-events:none;display:none}
.nikolaustag .stiefel{display:block}
/* Schlüssel antippen: die Haustür geht auf, draußen sieht man das Bild des Tages */
.stage .view.offen{z-index:4;visibility:hidden!important;-webkit-mask:url("bilder/tuer-durchblick.png") 0 0/100% 100% no-repeat;mask:url("bilder/tuer-durchblick.png") 0 0/100% 100% no-repeat}
.stage .view.offen.zeigen{visibility:visible!important}
.tuer-auf{position:absolute;z-index:4;pointer-events:none;display:none}
/* offene Tür liegt über der Nacht-Ebene: der Ausblick bleibt hell wie bei den Fenstern, die Tür selbst wird eigens abgedunkelt */
.tuer-nacht{position:absolute;z-index:4;pointer-events:none;display:none;background:#232a52;mix-blend-mode:multiply;opacity:0;transition:opacity .9s ease;
  -webkit-mask:url("bilder/tuer-auf.webp") 0 0/100% 100% no-repeat;mask:url("bilder/tuer-auf.webp") 0 0/100% 100% no-repeat}
.tuer-offen .tuer-nacht{display:block}
.licht-aus .tuer-nacht{opacity:.82}
.tuer-offen .tuer-auf{display:block}
html.raum-hoch .spot.schluessel,html.raum-hoch .spot.haustuer{display:none}
.globe-wrap.zoomed .spots .spot,.globe-wrap.zoomed .spots .kerl{pointer-events:auto}
.spot{position:absolute;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:30%}
.spot:focus-visible{outline:2px solid #ffe2a8}
.kerlbahn{position:absolute;pointer-events:none;overflow:hidden}
.kerl{transform-origin:50% 100%;overflow:visible}
.kerl .puff{position:absolute;left:15.3%;bottom:-3.2%;height:115.7%;width:auto;display:none}
.kerl.puffen img:not(.puff){visibility:hidden}
.kerl.puffen .puff{display:block}
.kerl{position:absolute;right:100%;bottom:0;height:40%;aspect-ratio:360/257;border:0;background:none;padding:0;cursor:pointer;visibility:hidden;-webkit-tap-highlight-color:transparent}
.kerl.laeuft{visibility:visible}
.kerl img:not(.puff){transform:scaleX(-1)}
.kerl img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.kerl .piep{position:absolute;left:10%;bottom:92%;font-family:var(--f-hand);font-size:max(13px,22%);color:#3a2418;background:#fff8f1;border-radius:999px;padding:.1em .55em;white-space:nowrap;opacity:0;transform:translateY(20%) scale(.8);transition:opacity .2s,transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.kerl.sagt .piep{opacity:1;transform:none}
html.raum-hoch .kerl{height:48%}
/* Fuyu taucht ab und zu auf, sitzt kurz da und verschwindet wieder */
.sitzer{position:absolute;border:0;background:none;padding:0;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent}
.sitzer.da{display:block}
.globe-wrap.zoomed .spots .sitzer{pointer-events:auto}
.sitzer img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.licht-aus .sitzer img{filter:brightness(.55) saturate(.7);transition:filter .9s}
/* Fuyu ins Bild einfügen: warmes Licht vom Raum annehmen und einen weichen Schatten auf den Boden werfen */
.kerl img,.sitzer img,.schlaefer img{filter:sepia(.5) saturate(1.25) hue-rotate(-8deg) brightness(.84) contrast(.9) blur(.35px) drop-shadow(-1px -1px 0 rgba(255,184,100,.32))}
.licht-aus .kerl img,.licht-aus .sitzer img,.licht-aus .schlaefer img{filter:sepia(.5) saturate(.8) brightness(.48) contrast(.9) blur(.35px)}
.kerl::before,.sitzer::before,.schlaefer::before{content:"";position:absolute;left:18%;right:18%;bottom:2%;height:16%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(25,9,2,.85),rgba(25,9,2,.45) 55%,rgba(25,9,2,0));pointer-events:none}
.sitzer::before{left:24%;right:14%;bottom:3%;height:15%}
.schlaefer::before{left:8%;right:8%;bottom:1%;height:14%}
.kerl.puffen::before{opacity:.5}
/* Nachts schläft Fuyu oben auf dem Schrank vor dem Baum */
.schlaefer{position:absolute;border:0;background:none;padding:0;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent}
.nachtzeit .schlaefer{display:block}
.globe-wrap.zoomed .spots .schlaefer{pointer-events:auto}
.schlaefer img{width:100%;height:100%;display:block;pointer-events:none}
.schlaefer .zz{position:absolute;left:62%;top:-10%;pointer-events:none;font-family:var(--f-hand);color:#fff8f1;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.schlaefer .zz i{position:absolute;font-style:normal;opacity:0;animation:zz 3.6s linear infinite;font-size:max(11px,1.1cqw)}
.schlaefer .zz i:nth-child(2){animation-delay:1.2s}
.schlaefer .zz i:nth-child(3){animation-delay:2.4s;font-size:max(14px,1.4cqw)}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(1.6em,-2.6em)}}
.schlaefer .piep{position:absolute;left:30%;bottom:95%;font-family:var(--f-hand);font-size:max(13px,1.1cqw);color:#3a2418;background:#fff8f1;border-radius:999px;padding:.1em .55em;white-space:nowrap;opacity:0;transform:translateY(20%) scale(.8);transition:opacity .2s,transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.schlaefer.sagt .piep{opacity:1;transform:none}
.licht-aus .schlaefer img{filter:brightness(.55) saturate(.7);transition:filter .9s}
.licht-aus .kerl img{filter:brightness(.55) saturate(.7);transition:filter .9s}

/* gemaltes Treppenhaus */
.flur{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;pointer-events:none;user-select:none;-webkit-user-select:none}
.stage .view{z-index:1}
.door{filter:none!important;animation:none!important;transform:none!important;background:none;border-radius:.5cqw}
.door::after{content:"";position:absolute;inset:-12% -14%;border-radius:1cqw;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 0 0 .18cqw rgba(255,240,205,.95),0 0 1.6cqw .4cqw rgba(255,210,130,.75)}
.door:hover::after,.door:focus-visible::after{opacity:1}
.door:focus-visible{outline:none}
.door.today::after{opacity:1;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .25cqw rgba(255,226,150,1),0 0 2.6cqw .9cqw rgba(255,200,110,.9)}}
.door.shake::after{opacity:1;animation:flash .5s ease}
@keyframes flash{30%{box-shadow:0 0 0 .25cqw rgba(255,255,255,1),0 0 2cqw .6cqw rgba(255,255,255,.8)}}
.door.open::after{opacity:1}
@media (prefers-reduced-motion:reduce){.door.today::after{animation:none}}

/* Papiertüten */
.door{position:absolute;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 0.38cqw 0.38cqw rgba(60,30,10,.35));transform-origin:50% 0}
.door > *{pointer-events:none}
.door:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:4px}
.bag{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.bag::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.08) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22))}
.s0 .bag{background:repeating-linear-gradient(90deg,#b4502f 0 0.67cqw,#f1e4d1 0.67cqw 1.34cqw)}
.s1 .bag{background:repeating-linear-gradient(90deg,#211c1a 0 0.61cqw,#eedfc8 0.61cqw 1.22cqw)}
.s2 .bag{background:repeating-linear-gradient(90deg,#1f7a52 0 0.77cqw,#155a3c 0.77cqw 1.02cqw,#1f7a52 1.02cqw 1.66cqw,#2b8c61 1.66cqw 1.79cqw)}
.fold{position:absolute;left:9%;right:9%;top:0;height:13%;background:rgba(0,0,0,.2);box-shadow:inset 0 -1px 0 rgba(255,255,255,.15)}
.sticker{position:absolute;left:50%;top:54%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#16120f;color:#fff;
  display:grid;place-items:center;font-family:var(--f-hand);font-size:1.98cqw;line-height:1}
.bclip{position:absolute;left:50%;top:-10%;width:34%;height:18%;transform:translateX(-50%);transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.bclip::before{content:"";position:absolute;left:12%;right:12%;top:0;height:62%;border:0.19cqw solid #c99a34;border-bottom:0;border-radius:0.51cqw 0.51cqw 0 0}
.bclip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;border-radius:0.13cqw;background:linear-gradient(180deg,#f3d27a,#c99a34 60%,#a67c22)}
.door.open .bclip,.door.opened .bclip{transform:translate(-50%,-160%) rotate(-28deg);opacity:0}
.door.opened .fold{background:#2b1f1a;height:9%;top:-1%;box-shadow:inset 0 3px 5px rgba(0,0,0,.5)}
.door.open{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-6%) rotate(-3deg)}}
.door.hang{animation:sway 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.door.today{animation:bob 2.4s ease-in-out infinite}
.door.today .sticker{box-shadow:0 0 0 0.32cqw #f3d27a,0 0 1.28cqw rgba(243,210,122,.95)}
@keyframes bob{50%{transform:translateY(-5%)}}
.door.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

@media (max-width:520px){header{padding:8px 16px 10px}.eyebrow{font-size:1rem}h1{font-size:1.55rem}.status{font-size:.85rem}}
footer{font-family:var(--f-hand);font-size:1.1rem;color:#fff8f1;text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--board);font-family:var(--f-display);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Karte */
.scrim{position:fixed;inset:0;background:rgba(40,20,18,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--board);border-radius:26px;max-width:640px;transition:max-width .7s cubic-bezier(.3,1,.4,1),padding .5s;width:100%;max-height:100%;overflow:auto;padding:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;border:3px solid var(--door-edge);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.scrim{transition:background .6s}
.scrim.cinema{background:rgba(15,8,6,.82)}
.card.cinema{max-width:min(1180px,96vw,calc((100vh - 330px) * 16 / 9 + 40px));padding:16px}
.card.cinema .clip::after{box-shadow:inset 0 0 30px 6px rgba(0,0,0,.4)}
@media (max-width:600px){.card.cinema{padding:12px}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.8rem;margin:0}
.card .date{font-family:var(--f-hand);font-size:1.25rem;color:var(--berry)}
.close{border:0;background:var(--door-a);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.close:focus-visible,.watch:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.note{font-family:var(--f-hand);font-size:1.45rem;line-height:1.35;margin:0;color:var(--ink)}
.video{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:18px;overflow:hidden;background:var(--inside);border:0}
.video iframe{width:100%;height:100%;border:0;display:block}
.clip{position:relative;overflow:hidden;isolation:isolate}
.clip iframe{position:absolute;inset:0;pointer-events:none;transform:scale(1.15);opacity:0;transition:opacity .3s}
.song.clip-on .clip iframe{opacity:1;transition:opacity 1.2s}
.clip::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 18px rgba(30,20,19,.55);border-radius:inherit;z-index:2}
.clip .cover{position:absolute;inset:0;z-index:1;background:var(--inside);opacity:1;transition:opacity .3s}
.song.clip-on .clip .cover{opacity:0;transition:opacity 1.2s}
.clip .cover .vinyl{width:auto;height:78%;animation-play-state:running}
.watch{display:flex;align-items:center;justify-content:center;gap:12px;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:18px;
  background:linear-gradient(135deg,var(--door-a),var(--door-d));color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.watch .play{width:64px;height:64px;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#card-media{display:flex;flex-direction:column;gap:12px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;text-decoration:none;color:var(--ink);
  background:var(--door-b);border:2px solid var(--door-edge);font-family:var(--f-body)}
.choice:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.choice .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.choice b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.choice small{display:block;color:var(--soft);font-size:.85rem}
.vinyl-wrap{display:grid;place-items:center;padding:8px 0 4px}
.vinyl{width:min(200px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#2b201e 0 2px,#3a2c29 2px 4px);box-shadow:0 10px 24px rgba(0,0,0,.28);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(255,255,255,.10) 55deg,transparent 70deg 220deg,rgba(255,255,255,.07) 235deg,transparent 250deg)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;
  font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,4vw,1.5rem)}
.vinyl .label::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:var(--board)}
.vinyl .label span{transform:translateY(-55%)}
.song.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.song{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--door-c);border:2px solid var(--door-edge)}
.song-head{display:flex;align-items:center;gap:12px}
.song-head .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.song-head b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.song-head small{display:block;color:var(--soft);font-size:1.02rem;line-height:1.3;font-family:var(--f-hand)}
.song audio{width:100%;max-width:100%}
/* kleine Widmung unten rechts im Bild */
.clip{position:relative}
/* Notizen, die ein eigener Satz sind, kommen in eine neue Zeile */
.song-head .notiz-zeile{display:block;margin-top:2px}
.clip .widmung{position:absolute;right:3.5%;bottom:5%;z-index:4;font-family:var(--f-titel);font-size:clamp(.95rem,3.4cqw,1.5rem);color:#fff8f1;text-shadow:0 1px 6px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5);pointer-events:none;letter-spacing:.02em}
.card.theater .clip .widmung{font-size:clamp(1.5rem,3.2vw,2.6rem);left:5%;right:5%;bottom:auto;top:calc(7% + env(safe-area-inset-top,0px));text-align:center;line-height:1.25}
.save{align-self:flex-start;text-decoration:none;background:var(--ink);color:var(--board);font-family:var(--f-display);font-size:1rem;font-weight:500;padding:10px 18px;border-radius:999px}
.save:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.guide{border-radius:14px;background:var(--board);padding:10px 14px;font-size:.95rem}
.guide summary{cursor:pointer;font-family:var(--f-display);font-weight:500}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .once{color:var(--soft)}
.soon{aspect-ratio:16/9;width:100%;border-radius:18px;border:3px dashed var(--door-edge);display:grid;place-items:center;text-align:center;padding:16px;
  font-family:var(--f-hand);font-size:1.4rem;color:var(--soft)}

/* Karte im Look des Tagesbilds */
.card.has-pic{background:linear-gradient(rgba(25,15,12,.6),rgba(25,15,12,.82)),var(--pic) center/cover;border-color:rgba(255,255,255,.18);color:#fff8f1}
.card.has-pic h2,.card.has-pic .note,.card.has-pic .song-head b{color:#fff8f1}
.card.has-pic .date{color:#f6c3cc}
.card.has-pic .song{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card.has-pic .song-head small{color:rgba(255,248,241,.75)}
.card.has-pic .save{background:#fff8f1;color:var(--ink)}
.card.has-pic .guide{background:rgba(255,248,241,.94);color:var(--ink)}
.card.has-pic .vinyl-wrap:not(.cover){aspect-ratio:16/9;max-width:100%;border-radius:14px;padding:0;background:var(--pic) center/cover;box-shadow:inset 0 0 40px 10px rgba(0,0,0,.35)}
.card.has-pic .vinyl-wrap .vinyl{width:auto;height:70%;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.card.has-pic .clip .cover{background:var(--pic) center/cover}
.card.has-pic .vinyl .label{background:center/cover var(--pic)}
.card.has-pic .vinyl .label span{text-shadow:0 1px 6px rgba(0,0,0,.7)}

/* Großbild: fast Vollbild für Clip oder Schallplatte */
.song-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big-btn{border:2px solid var(--door-edge);background:transparent;color:inherit;font-family:var(--f-display);font-size:1rem;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer}
.card.has-pic .big-btn{border-color:rgba(255,248,241,.45);color:#fff8f1}
.big-btn:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
/* Großbild: echtes Vollbild, Clip oder Bild randlos, Steuerung schwebt unten */
.scrim.theater{background:#000;padding:0;place-items:stretch}
.card.theater{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;padding:0;gap:0;border:0;border-radius:0;
  background:#000;overflow:hidden;animation:none;transform:none}
.card.theater .card-head,.card.theater .note,.card.theater .guide,.card.theater .song-head{display:none}
.card.theater #card-media{position:absolute;inset:0;display:block}
.card.theater .song{position:absolute;inset:0;padding:0;border:0;border-radius:0;background:#000;display:block}
.card.theater .clip,.card.theater .song > .vinyl-wrap{position:absolute;inset:0;width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0;container-type:size}
.card.theater .clip::after{box-shadow:inset 0 0 120px 30px rgba(0,0,0,.55);border-radius:0}
.card.theater .clip iframe{inset:auto;left:50%;top:50%;width:max(100cqw,calc(100cqh * 16 / 9));height:max(100cqh,calc(100cqw * 9 / 16));transform:translate(-50%,-50%) scale(1.15)}
.card.theater .clip .cover{border-radius:0}
.card.theater .vinyl-wrap .vinyl{height:46%;width:auto}
.card.theater .song > .vinyl-wrap{box-shadow:inset 0 0 160px 40px rgba(0,0,0,.6)}
.card.theater audio,.card.theater .song-actions{position:absolute;z-index:5;left:50%;transform:translateX(-50%);transition:opacity .5s}
.card.theater audio{bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(560px,86%)}
.card.theater .song-actions{bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:center;flex-wrap:nowrap}
.card.theater .song-actions .save{background:rgba(255,248,241,.92);color:var(--ink)}
.card.theater .song-actions .big-btn{background:rgba(20,12,8,.55);border-color:rgba(255,248,241,.5);color:#fff8f1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card.theater.idle audio,.card.theater.idle .song-actions{opacity:0;pointer-events:none}
.card.theater.idle{cursor:none}
/* Hochkant Clip (Handyvideo): im Kärtchen füllt die Mitte des Videos das Feld, im Großbild bleibt es hochkant */
.card.clip-hoch .clip iframe{inset:auto;left:0;top:50%;width:100%;height:auto;aspect-ratio:9/16;transform:translateY(-50%) scale(1.15)}
.card.theater.clip-hoch .clip iframe{left:50%;width:auto;height:100cqh;aspect-ratio:9/16;transform:translate(-50%,-50%) scale(1.15)}
.card.theater.clip-hoch .clip{background:#000}
@media (orientation:portrait){
  .card.theater.clip-hoch .clip iframe{width:max(100cqw,calc(100cqh * 9 / 16));height:max(100cqh,calc(100cqw * 16 / 9));aspect-ratio:auto}
}
/* Handy hochkant: alles um 90 Grad drehen, Handy einfach zur Seite drehen */
@media (orientation:portrait) and (max-width:820px){
  .card.theater:not(.clip-hoch){inset:auto;left:50%;top:50%;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
}
.song-bar{display:none}

/* kleines Albumcover statt Notensymbol */
.song-head .cover-art{width:46px;height:46px;flex:none;border-radius:8px;font-size:0;
  background:repeating-radial-gradient(circle at 50% 50%,#1c1513 0 1.5px,#2c221f 1.5px 3px);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12);position:relative}
.song-head .cover-art::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--berry);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.card.has-pic .song-head .cover-art{background:var(--pic) center/cover}
.card.has-pic .song-head .cover-art::after{display:none}

/* Schneekugel (gemalt) */
.globe-wrap{transition:margin-bottom .35s,left .6s ease;position:relative;width:calc(min(92vw,calc((100vh - 270px) * 478 / 625),600px) * var(--gk,1));min-width:150px;aspect-ratio:478/566;margin-top:4px}
.globe-img{transition:opacity .35s;position:absolute;top:0;left:0;width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;pointer-events:none;
  filter:drop-shadow(0 24px 30px rgba(30,10,5,.4));transform-origin:50% 92%}
/* echtes Treppenhaus im Glas */
.globe{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;z-index:1;overflow:hidden;transform-origin:50% 92%}
.globe .scene{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-width:none;border-radius:50%;overflow:hidden;box-shadow:none;background:#2a1d18}
.globe .stage{position:absolute;inset:auto;top:0;left:50%;height:100%;width:auto;aspect-ratio:var(--ra,2576/1438);transform:translateX(var(--rx,-55.5%))}
.globe .scene::after{content:"";position:absolute;inset:1.3%;border-radius:50%;pointer-events:none;z-index:9;
  background:
    radial-gradient(ellipse 30% 18% at 30% 18%,rgba(255,255,255,.42),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 8% 4% at 72% 13%,rgba(255,255,255,.35),rgba(255,255,255,0) 80%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 64%,rgba(225,235,245,.14) 82%,rgba(240,245,250,.38) 100%);
  box-shadow:inset -14px -20px 40px rgba(255,255,255,.12),inset 12px 16px 36px rgba(0,0,0,.22)}
.globe-wrap:not(.zoomed) #grid{pointer-events:none}
.globe-img{z-index:2}
/* Kreis der Kugel im Bild: Mitte 50% / 42.4%, Durchmesser 97.5% der Breite */
.globe-snow{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:3;transform-origin:50% 92%}
.globe-enter{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;border:0;background:none;cursor:zoom-in;z-index:4;-webkit-tap-highlight-color:transparent}
.globe-enter:focus-visible{outline:3px solid #ffe2a8;outline-offset:4px}
.shake-btn{position:absolute;left:12%;right:12%;bottom:1%;height:22%;z-index:5;border:0;background:none;cursor:pointer;border-radius:40px;-webkit-tap-highlight-color:transparent}
.shake-btn:focus-visible{outline:3px solid #ffe2a8;outline-offset:2px}
.globe-hint{font-family:var(--f-hand);font-size:1.05rem;color:#fff8f1;text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center;max-width:46ch}
.globe-wrap.shaking .globe-img,.globe-wrap.shaking .globe-snow,.globe-wrap.shaking .globe{animation:wobble .6s ease}
@keyframes wobble{20%{transform:rotate(-3deg)}45%{transform:rotate(2.5deg)}70%{transform:rotate(-1.2deg)}}
.globe-back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:16;border:0;
  background:var(--board);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:1rem;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer}
/* Übergänge beim Hineintauchen (WebGL). Ohne WebGL gibt es automatisch den schlichten Zoom. */
#wurmloch{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#wurmloch.on{opacity:1;visibility:visible;transition:opacity .2s}
html.linse:not(.ueb-schlicht) .globe-wrap.zoomed .globe{animation:none}
.ueb-btn{position:fixed;z-index:12;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:none;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 13px;cursor:pointer;
  background:rgba(20,12,8,.5);color:#fff8f1;font-family:var(--f-display);font-size:.9rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html.linse .ueb-btn{display:flex}
body.peek .ueb-btn,body.zoomed-on .ueb-btn{opacity:0;pointer-events:none}
@media (max-width:520px){.ueb-btn span{display:none}.ueb-btn{padding:9px 11px}}
.ueb-menu{position:fixed;z-index:13;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));
  background:rgba(255,248,241,.96);border-radius:18px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:210px}
.ueb-menu[hidden]{display:none}
.ueb-menu b{font-family:var(--f-display);font-weight:600;font-size:.95rem;padding:6px 10px 4px;color:var(--ink)}
.ueb-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;font-family:var(--f-body);font-size:.95rem;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.ueb-menu button:hover{background:rgba(201,86,107,.1)}
.ueb-menu button[aria-checked="true"]{background:var(--door-a);font-weight:700}
/* hineingezoomt */
/* Der Raum füllt den ganzen Bildschirm, als würde man drin stehen. Was übersteht, kann man verschieben. */
.globe-wrap.sofort,.globe-wrap.sofort *{transition:none!important;animation:none!important}
.globe-wrap.zoomed .globe{display:block;position:fixed;z-index:15;overflow:hidden;border-radius:0;aspect-ratio:auto;width:auto;inset:0;
  animation:dive .55s cubic-bezier(.2,.9,.3,1)}
@keyframes dive{from{transform:scale(.55);opacity:0;border-radius:50%}}
.globe-wrap.zoomed .scene{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-width:none;box-shadow:none;border-radius:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.globe-wrap.zoomed .scene::-webkit-scrollbar{display:none}
/* höchstens so weit hineinzoomen, dass alle Tüten von 1 bis 24 drauf passen. Bleibt seitlich Platz, füllt ihn der Raum weich verschwommen weiter. */
.globe-wrap.zoomed .stage{position:relative;inset:auto;left:auto;transform:none;margin:0 auto;height:max(100%,min(calc(100vw / (var(--ra,2576/1438))),calc(100% * 1.12)));width:auto;aspect-ratio:var(--ra,2576/1438)}
.flur-rand{display:none}
/* Hochkant: höheres Treppenhausbild. In der kleinen Kugel sieht man den unteren Teil mit den Tüten, drinnen den ganzen Raum. */
html.raum-hoch .globe .stage{aspect-ratio:1923/2576;height:auto;width:106%;left:-3%;top:-42%;transform:none}
html.raum-hoch .globe-wrap.zoomed .stage{aspect-ratio:1923/2576;top:auto;left:auto;width:auto;height:max(100%,calc(100vw * 2576 / 1923))}
html.raum-hoch .door::before{content:"";position:absolute;inset:-14% -22%}
.globe-wrap.zoomed .flur-rand{display:block;position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(28px) brightness(.85);pointer-events:none;z-index:0}
.globe-wrap.zoomed .scene{z-index:1;background:none}
.globe-wrap.zoomed .globe-snow{display:none}
.globe-wrap.zoomed .globe .scene::after{display:none}
.globe-wrap.zoomed::before{content:"";position:fixed;inset:-50vh -50vw;background:rgba(15,8,6,.78);z-index:14}
@media (prefers-reduced-motion:reduce){.globe-wrap.zoomed .globe,.globe-wrap.shaking .globe-img,.globe-wrap.shaking .globe-snow{animation:none}}

/* Titel als gemalte Schrift direkt im Bild */
:root{--t-ink:#4a2413;--t-glow:rgba(255,236,205,.9);--t-glow2:rgba(255,214,160,.55);--t-accent:#7a2e1c}
html.dark-top{--t-ink:#fff4e2;--t-glow:rgba(25,12,6,.85);--t-glow2:rgba(255,190,120,.35);--t-accent:#ffd98a}
header{background:none;box-shadow:none;border-radius:0;padding:4px 10px 0}
header .eyebrow,header h1,header .status{font-family:var(--f-titel,"Dancing Script","Segoe Script",cursive);color:var(--t-ink);transition:color .8s}
header .eyebrow{font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:500;
  text-shadow:0 0 6px var(--t-glow),0 0 14px var(--t-glow),0 0 26px var(--t-glow2)}
header h1{font-weight:700;font-size:clamp(2.3rem,5.6vw,3.4rem);line-height:1.02;letter-spacing:.005em;
  text-shadow:0 0 8px var(--t-glow),0 0 18px var(--t-glow),0 0 40px var(--t-glow2)}
header .status{font-size:clamp(1.1rem,2.3vw,1.4rem);font-weight:500;margin-top:2px;
  text-shadow:0 0 6px var(--t-glow),0 0 14px var(--t-glow),0 0 26px var(--t-glow2)}
header .pill{background:none;border:0;padding:0;border-radius:0;color:var(--t-accent);font-weight:700}

.motion-btn{border:0;background:rgba(255,248,241,.92);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:.95rem;
  padding:8px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(20,8,4,.3);cursor:pointer}
.motion-btn:focus-visible{outline:3px solid #ffe2a8;outline-offset:2px}

/* ganzes Hintergrundbild ansehen */
.peek-btn{position:fixed;z-index:12;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 13px;cursor:pointer;
  background:rgba(20,12,8,.5);color:#fff8f1;font-family:var(--f-display);font-size:.9rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.peek-btn:focus-visible,.peek-close:focus-visible{outline:3px solid #ffe2a8;outline-offset:2px}
@media (max-width:520px){.peek-btn span{display:none}.peek-btn{padding:9px}}
.peek-close{position:fixed;z-index:13;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));border:0;border-radius:999px;
  padding:9px 15px;background:rgba(255,248,241,.92);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:1rem;box-shadow:var(--shadow);cursor:pointer}
.peek-hint{position:fixed;z-index:13;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font-family:var(--f-hand);font-size:1.2rem;color:#fff8f1;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;animation:hintfade 3.5s forwards}
@keyframes hintfade{0%,70%{opacity:1}100%{opacity:0}}
body.peek .wrap,body.peek .peek-btn{opacity:0;pointer-events:none}
.wrap{transition:opacity .5s}
body.peek .bg{z-index:11;cursor:grab;touch-action:none}
body.peek .bg::after{opacity:0}
body.peek .bg .layer{transition:opacity 1.6s ease,background-size .5s ease}
@media (min-aspect-ratio:16/10){ body.peek .bg .layer{background-size:contain!important;background-position:center!important} body.peek .bg{background:#120c0a} }

/* Kugel steht unten im Bild auf dem Boden, Texte oben */
.wrap{min-height:100vh;min-height:100dvh}
.wrap > header{order:0}
.wrap > .motion-btn,.wrap > .globe-hint,.wrap > footer{order:1}
.wrap > .globe-wrap{order:2;margin-top:auto}
.wrap > .globe-back{order:3}
.globe-wrap.anker:not(.zoomed) .globe,.globe-wrap.anker .globe-img,.globe-wrap.anker:not(.zoomed) .globe-snow{scale:1 var(--ey,1);transform-origin:50% 50%}
/* Computer mit Kugel im Bild: Texte etwas höher, die letzte Zeile fällt weg, damit die Kugel frei steht */

  }

})();
/* Kleine Geräusche im Raum, direkt im Browser erzeugt (keine Tondateien) */
const RAUMTON = (function(){
  let ac = null;
  const ctx = () => { ac = ac || window._tonCtx || new (window.AudioContext || window.webkitAudioContext)(); if(ac.state === "suspended") ac.resume(); return ac; };
  function rauschen(c, dauer){ const b = c.createBuffer(1, Math.ceil(c.sampleRate * dauer), c.sampleRate), d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = c.createBufferSource(); s.buffer = b; return s; }
  // Schellen wie am Rentierschlitten, dazu leises Rascheln der Zweige
  function glocken(){
    const c = ctx(), t0 = c.currentTime, out = c.createGain(); out.gain.value = .22; out.connect(c.destination);
    for(let i = 0; i < 14; i++){
      const t = t0 + i * .055 + Math.random() * .03, f = 2400 + Math.random() * 1600;
      [1, 2.76, 5.4].forEach((m, j)=>{
        const o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f * m;
        const v = (.5 / (j + 1)) * (1 - i / 18);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .004); g.gain.exponentialRampToValueAtTime(.0008, t + .35 - j * .08);
        o.connect(g).connect(out); o.start(t); o.stop(t + .4);
      });
    }
    const n = rauschen(c, .7), bp = c.createBiquadFilter(), g = c.createGain();
    bp.type = "bandpass"; bp.frequency.value = 4500; bp.Q.value = .8;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.12, t0 + .08); g.gain.exponentialRampToValueAtTime(.001, t0 + .7);
    n.connect(bp).connect(g).connect(out); n.start(t0);
  }
  // Klick vom Lichtschalter
  function klick(){
    const c = ctx(), t0 = c.currentTime;
    [[0, .5], [.035, .25]].forEach(([d, v])=>{
      const n = rauschen(c, .03), hp = c.createBiquadFilter(), g = c.createGain();
      hp.type = "bandpass"; hp.frequency.value = 2200; hp.Q.value = 1.2;
      g.gain.setValueAtTime(v, t0 + d); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .025);
      n.connect(hp).connect(g).connect(c.destination); n.start(t0 + d);
    });
  }
  // altes Licht: kurzes elektrisches Zzzzp
  function zzzp(){
    const c = ctx(), t0 = c.currentTime, out = c.createGain(); out.gain.value = .14; out.connect(c.destination);
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.setValueAtTime(100, t0); lp.type = "lowpass"; lp.frequency.value = 2500;
    g.gain.setValueAtTime(0, t0);
    for(let i = 0; i < 9; i++){ const t = t0 + i * .035; g.gain.setValueAtTime(Math.random() < .65 ? .9 : .15, t); }
    g.gain.setValueAtTime(.6, t0 + .32); g.gain.exponentialRampToValueAtTime(.001, t0 + .55);
    o.connect(lp).connect(g).connect(out); o.start(t0); o.stop(t0 + .6);
    const n = rauschen(c, .4), hp = c.createBiquadFilter(), gn = c.createGain();
    hp.type = "highpass"; hp.frequency.value = 3000;
    gn.gain.setValueAtTime(.5, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + .35);
    n.connect(hp).connect(gn).connect(out); n.start(t0);
  }
  // Schlüsselbund klimpert
  function schluessel(){
    const c = ctx(), t0 = c.currentTime, out = c.createGain(); out.gain.value = .12; out.connect(c.destination);
    for(let i = 0; i < 7; i++){
      const t = t0 + i * .045 + Math.random() * .03, f = 3200 + Math.random() * 2200;
      [1, 2.4].forEach((m, j)=>{ const o = c.createOscillator(), g = c.createGain(); o.type = "triangle"; o.frequency.value = f * m;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5 / (j + 1), t + .003); g.gain.exponentialRampToValueAtTime(.001, t + .12);
        o.connect(g).connect(out); o.start(t); o.stop(t + .14); });
    }
  }
  // alte Tür knarrt
  function knarren(){
    const c = ctx(), t0 = c.currentTime + .25, out = c.createGain(); out.gain.value = .09; out.connect(c.destination);
    const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), bp = c.createBiquadFilter(), g = c.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(140, t0); o.frequency.linearRampToValueAtTime(260, t0 + .5); o.frequency.linearRampToValueAtTime(180, t0 + .9);
    lfo.frequency.value = 23; lg.gain.value = 40; lfo.connect(lg).connect(o.frequency);
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 3;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1, t0 + .08); g.gain.setValueAtTime(1, t0 + .7); g.gain.exponentialRampToValueAtTime(.001, t0 + .95);
    o.connect(bp).connect(g).connect(out); o.start(t0); lfo.start(t0); o.stop(t0 + 1); lfo.stop(t0 + 1);
  }
  return { glocken, klick, zzzp, schluessel, knarren };
})();

/* Arnes kleiner Kerl: rennt ab und zu über den Boden. Antippen: "Huch!" und er rennt schneller */
(function(){
  const k = document.querySelector(".kerl"), bahn = document.querySelector(".kerlbahn"), wrap = document.getElementById("globeWrap");
  let anim = null, t = null;
  const drin = () => wrap && wrap.classList.contains("zoomed");
  // Nachts (21:30 bis 6:00) schläft er nur. Zum Testen: ?nacht im Link
  const globeEl = document.getElementById("globe"), schl = document.querySelector(".schlaefer");
  function istNacht(){ if(/nacht/.test(location.search)) return true; const d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m >= 21 * 60 + 30 || m < 6 * 60; }
  function nachtPruefen(){
    const n = istNacht();
    if(n && !globeEl.classList.contains("nachtzeit")){ schl.querySelector("img").src = "bilder/fuyu-schlaeft.webp"; }
    globeEl.classList.toggle("nachtzeit", n);
  }
  nachtPruefen(); setInterval(nachtPruefen, 60000);
  schl.addEventListener("click", e=>{ e.stopPropagation(); schl.classList.add("sagt"); clearTimeout(schl._t); schl._t = setTimeout(()=>schl.classList.remove("sagt"), 1600); });
  function plan(ms){ clearTimeout(t); t = setTimeout(()=> istNacht() ? plan(60000) : (Math.random() < .4 ? sitzen() : rennen()), ms); }
  // ab und zu: er erscheint, sitzt eine Weile, verschwindet wieder
  const sz = document.querySelector(".sitzer"), szImg = sz.querySelector("img"), KOMMT = "bilder/fuyu-sitzt.webp", GEHT = "bilder/fuyu-geht.webp";
  let sitzt = false, szT = null;
  function sitzen(){
    if(!drin() || anim || sitzt){ plan(4000); return; }
    sitzt = true; new Image().src = GEHT;
    // mal auf dem Boden, mal oben auf dem Schrank vor dem Weihnachtsbaum
    { const ort = Math.random() < .5 ? "sitz" : "sitz2", R = RAUM[raumArt], [x0,y0,x1,y1] = SPOTS[raumArt][ort];
      sz.style.left = x0/R.w*100 + "%"; sz.style.top = y0/R.h*100 + "%"; sz.style.width = (x1-x0)/R.w*100 + "%"; sz.style.height = (y1-y0)/R.h*100 + "%"; }
    // eine Datei: auftauchen, sitzen, verschwinden (15 Sekunden). Erst komplett laden, dann frisch einsetzen, damit sie von vorne startet
    const pre = new Image();
    pre.onload = ()=>{ szImg.src = pre.src; sz.classList.add("da"); szT = setTimeout(weg, 15000); };
    pre.src = KOMMT;
  }
  function weg(){ clearTimeout(szT); sz.classList.remove("da"); szImg.removeAttribute("src"); sitzt = false; plan(15000 + Math.random() * 20000); }
  // Antippen: sofort verschwinden
  function gehen(){
    clearTimeout(szT);
    const pre = new Image();
    pre.onload = ()=>{ szImg.src = pre.src; szT = setTimeout(weg, 3000); };
    pre.src = GEHT + "?" + Date.now();
  }
  sz.addEventListener("click", e=>{ e.stopPropagation(); if(!sitzt || !sz.classList.contains("da")) return; quietsch(); gehen(); });
  function rennen(){
    if(!drin() || anim || sitzt){ plan(4000); return; }
    // er kommt hinter der Heizung hervor, rennt nach rechts und verschwindet hinter dem Schränkchen an der Tür, Tempo immer gleich
    const weg = bahn.clientWidth + k.offsetWidth * 1.1, raum = bahn.parentElement.clientWidth || 1000;
    k.classList.add("laeuft");
    anim = k.animate([{transform:"translateX(0)"},{transform:`translateX(${weg}px)`}], {duration: weg / raum * 11000, easing: "linear"});
    anim.onfinish = anim.oncancel = ()=>{ k.classList.remove("laeuft", "sagt"); anim = null; plan(15000 + Math.random() * 20000); };
  }
  // kleines Quietschen, direkt im Browser erzeugt (keine Tondatei nötig)
  let ac = null;
  let letzt = 0;
  function quietsch(){
    let n; do{ n = 1 + Math.floor(Math.random() * 5); }while(n === letzt); letzt = n; TON("quiek" + n, .7); return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if(ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime;
      [[0, 1500, 2600], [.13, 1800, 3100]].forEach(([d, f0, f1])=>{
        const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine";
        o.frequency.setValueAtTime(f0, t0 + d); o.frequency.exponentialRampToValueAtTime(f1, t0 + d + .07); o.frequency.exponentialRampToValueAtTime(f0 * 1.1, t0 + d + .11);
        g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.16, t0 + d + .012); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .12);
        o.connect(g).connect(ac.destination); o.start(t0 + d); o.stop(t0 + d + .13);
      });
    }catch(e){}
  }
  // Antippen: er bleibt stehen, dreht sich erschrocken um, quietscht und verschwindet in einer Glitzerwolke
  const puff = k.querySelector(".puff"), PUFF = "bilder/kerl-puff.webp";
  new Image().src = PUFF;
  let flieht = false;
  k.addEventListener("click", e=>{
    e.stopPropagation(); if(!anim || flieht) return; flieht = true;
    anim.pause();
    puff.src = PUFF + "?" + Date.now(); k.classList.add("puffen");
    quietsch();
    setTimeout(()=>{ k.classList.add("sagt"); }, 450);
    setTimeout(()=>k.classList.remove("sagt"), 1700);
    setTimeout(()=>{ anim.onfinish = anim.oncancel = null; anim.cancel(); anim = null;
      k.classList.remove("puffen", "laeuft"); puff.removeAttribute("src"); flieht = false; plan(20000 + Math.random() * 20000); }, 3050);
  });
  plan(5000);
})();

let clipPlayer = null, clipReady = false, ytApi = null, clipShowT = null;
/* kurz vor Ende zurückspringen, damit YouTube kein Endbild und keinen Titel zeigt */
setInterval(()=>{
  try{
    if(!clipPlayer || !clipReady || clipPlayer.getPlayerState() !== 1) return;
    const d = clipPlayer.getDuration(), t = clipPlayer.getCurrentTime();
    if(d > 2 && d - t < 1.2) clipPlayer.seekTo(0, true);
  }catch(e){}
}, 250);
function loadYtApi(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res=>{
    if(window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prev) prev(); res(window.YT); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function initClip(el){
  const vid = el.dataset.clip, box = el.closest(".song");
  clipPlayer = null; clipReady = false;
  loadYtApi().then(YT=>{
    if(!document.body.contains(el)) return;
    clipPlayer = new YT.Player(el, {
      host: "https://www.youtube-nocookie.com",
      videoId: vid,
      playerVars: { mute:1, controls:0, loop:1, playlist:vid, playsinline:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, modestbranding:1 },
      events: {
        onReady: e=>{
          clipReady = true; e.target.mute();
          if(box.classList.contains("playing")) e.target.playVideo();
        },
        onStateChange: e=>{
          clearTimeout(clipShowT);
          if(e.data === 1 && box.classList.contains("playing")){
            clipShowT = setTimeout(()=>{ if(box.classList.contains("playing")) box.classList.add("clip-on"); }, 4000);
          } else if(e.data === 2 || e.data === 0) box.classList.remove("clip-on");
        }
      }
    });
  });

   ob sich die Seite auf GitHub geändert hat, und lädt dann neu (nur wenn gerade nichts offen ist). */
(function(){
  let mark = null, pending = false;
  async function stamp(){
    try{
      const r = await fetch("index.html?check=" + Date.now(), {cache:"no-store"});
      return r.headers.get("etag") || r.headers.get("last-modified") || String((await r.text()).length);
    }catch(e){ return null; }
  }
  async function check(){
    const s = await stamp(); if(!s) return;
    if(mark === null){ mark = s; return; }
    if(s !== mark) pending = true;
    tryReload();
  }
  function idle(){ return scrim.hidden && !document.body.classList.contains("peek") && !document.getElementById("globeWrap").classList.contains("zoomed"); }
  function tryReload(){ if(pending && idle()) location.reload(); }
  check();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") check(); });
  addEventListener("pageshow", e=>{ if(e.persisted) check(); });
  setInterval(check, 30*60*1000);
  setInterval(tryReload, 5000);
})();

(function(){
  const btn = document.getElementById("peekBtn"), close = document.getElementById("peekClose"), hint = document.getElementById("peekHint"), bg = document.querySelector(".bg");
  let px = 50, startX = 0, startPx = 50, drag = false;
  const layers = () => [...bg.querySelectorAll(".layer")];
  function apply(){ layers().forEach(l=>{ l.style.backgroundPosition = px + "% 50%"; }); }
  function imgOverflow(){ // wie viel breiter das Bild ist als der Bildschirm (in px)
    const l = bg.querySelector(".layer.on"); if(!l || !l._w){ return innerWidth; }
    return Math.max(1, innerHeight * l._w / l._h - innerWidth);
  }
  function measure(){ layers().forEach(l=>{ const m = (l.style.backgroundImage||"").match(/url\("?(.*?)"?\)/); if(!m) return; const i = new Image(); i.onload = ()=>{ l._w = i.naturalWidth; l._h = i.naturalHeight; }; i.src = m[1]; }); }
  function open(){
    document.body.classList.add("peek"); close.hidden = false;
    const l = bg.querySelector(".layer.on");
    // Hochformat Bild mit Sockel: beim Ansehen lieber das ganze Originalbild zeigen
    if(l && bgCurrent && window._shownBg && window._shownBg !== bgCurrent){ l.style.backgroundImage = `url("${bgCurrent}")`; l.style.backgroundPosition = ""; }
    measure(); layers().forEach(l=>{ l.style.backgroundSize = ""; });
    const pos = l && l.style.backgroundPosition; px = 50;
    if(pos && /%/.test(pos)) px = parseFloat(pos);
    apply();
    if(innerWidth / innerHeight < 1.6){ hint.hidden = false; hint.style.animation = "none"; void hint.offsetWidth; hint.style.animation = ""; }
    close.focus();
  }
  function shut(){
    document.body.classList.remove("peek"); close.hidden = true; hint.hidden = true;
    layers().forEach(l=>{ l.style.backgroundPosition = ""; });
    try{ bgCurrent && setBg.__reapply && setBg.__reapply(); }catch(e){}
    const cur = bgCurrent; bgCurrent = null; setBg(cur);
    btn.focus();
  }
  btn.addEventListener("click", open); close.addEventListener("click", shut);
  document.addEventListener("keydown", e=>{ if(e.key === "Escape" && document.body.classList.contains("peek")) shut(); });
  bg.addEventListener("pointerdown", e=>{ if(!document.body.classList.contains("peek")) return; drag = true; startX = e.clientX; startPx = px; bg.setPointerCapture(e.pointerId); bg.style.cursor = "grabbing"; });

})();
