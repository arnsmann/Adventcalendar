<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adventskalender für dich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Gochi+Hand&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: ein warmes "Strickpulli" Brett mit Lichterkette oben, 24 bunt gemischte Türchen im Raster, Inhalt öffnet sich als Karte */
:root{
  --bg:#f7e6e1;        /* zartes Rosa */
  --board:#fff6f1;
  --ink:#5a3a31;       /* Kakao */
  --soft:#9a7469;
  --pine:#4f7a63;      /* Tannengrün */
  --berry:#c9566b;
  --honey:#e8b04b;
  --door-a:#f0c9c0; --door-b:#cfe0d2; --door-c:#f5ddb0; --door-d:#e7d3ea;
  --door-edge:rgba(90,58,49,.18);
  --inside:#5a3a31;
  --shadow:0 10px 30px rgba(120,70,60,.16);
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1d1b; --board:#352523; --ink:#f6e3dc; --soft:#c6a59b;
  --pine:#7fb394; --berry:#ec8496; --honey:#f2c46a;
  --door-a:#6b3f41; --door-b:#3f5a4b; --door-c:#6e5634; --door-d:#55405b;
  --door-edge:rgba(255,230,220,.14); --inside:#1e1413;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1d1b; --board:#352523; --ink:#f6e3dc; --soft:#c6a59b;
  --pine:#7fb394; --berry:#ec8496; --honey:#f2c46a;
  --door-a:#6b3f41; --door-b:#3f5a4b; --door-c:#6e5634; --door-d:#55405b;
  --door-edge:rgba(255,230,220,.14); --inside:#1e1413;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:radial-gradient(circle at 1px 1px,var(--door-edge) 1px,transparent 1.5px);background-size:22px 22px;min-height:100%}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* Lichterkette */
.lights{position:relative;height:56px;margin:0 -16px;overflow:hidden}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulbs{position:absolute;inset:0;display:flex;justify-content:space-around;padding:0 20px}
.bulb{width:12px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:var(--y);background:var(--c);
  box-shadow:0 0 12px var(--c);animation:glow 2.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes glow{50%{opacity:.45;box-shadow:0 0 2px var(--c)}}

header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.eyebrow{font-family:var(--f-hand);font-size:1.5rem;color:var(--berry);transform:rotate(-2deg)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:0;text-wrap:balance}
h1 .star{color:var(--honey)}
.status{font-family:var(--f-display);font-size:1.05rem;color:var(--soft);margin:4px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:var(--board);border:2px dashed var(--door-edge);border-radius:999px;padding:4px 14px;color:var(--ink)}

.board{background:var(--board);border-radius:28px;padding:clamp(14px,3vw,28px);box-shadow:var(--shadow);border:3px solid var(--door-edge)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,1.6vw,16px)}
@media (max-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:380px){.grid{grid-template-columns:repeat(3,1fr)}}

.door{position:relative;aspect-ratio:1/1.12;max-width:100%;perspective:700px;border:0;padding:0;background:transparent;cursor:pointer;font:inherit;color:inherit}
.door.big{grid-column:span 2;aspect-ratio:2/1.12}
.door > *{pointer-events:none}
.door{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.door:focus-visible{outline:3px solid var(--berry);outline-offset:4px;border-radius:18px}
.inside{position:absolute;inset:0;border-radius:16px;background:var(--inside);display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 4px 14px rgba(0,0,0,.35)}
.inside span{font-size:1.9rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.leaf{position:absolute;inset:0;border-radius:16px;background:var(--dc);border:2px solid var(--door-edge);
  transform-origin:left center;transition:transform .7s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 3px 0 var(--door-edge)}
.leaf::before{content:"";position:absolute;inset:7px;border:2px dashed var(--door-edge);border-radius:11px;pointer-events:none}
.leaf::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--honey);box-shadow:0 1px 0 var(--door-edge)}
.num{font-family:var(--f-display);font-weight:600;font-size:clamp(1.5rem,4vw,2.3rem);line-height:1}
.doodle{font-size:.9rem;opacity:.75;line-height:1}
.door.locked .leaf{filter:saturate(.75)}
.door.open .leaf{transform:rotateY(-105deg)}
.door.opened .leaf{transform:rotateY(-105deg)}
.door.today .leaf{animation:bob 2.4s ease-in-out infinite}
.door.today .leaf::before{border-color:var(--berry)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg)}}
.door.shake .leaf{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--board);font-family:var(--f-display);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Karte */
.scrim{position:fixed;inset:0;background:rgba(40,20,18,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--board);border-radius:26px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;border:3px solid var(--door-edge);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.8rem;margin:0}
.card .date{font-family:var(--f-hand);font-size:1.25rem;color:var(--berry)}
.close{border:0;background:var(--door-a);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.close:focus-visible,.watch:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.note{font-family:var(--f-hand);font-size:1.45rem;line-height:1.35;margin:0;color:var(--ink)}
.video{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:18px;overflow:hidden;background:var(--inside);border:0}
.video iframe{width:100%;height:100%;border:0;display:block}
.clip{position:relative;overflow:hidden;isolation:isolate}
.clip iframe{position:absolute;inset:0;pointer-events:none;transform:scale(1.42);opacity:0;transition:opacity .3s}
.song.clip-on .clip iframe{opacity:1;transition:opacity 1.2s}
.clip::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 18px rgba(30,20,19,.55);border-radius:inherit;z-index:2}
.clip .cover{position:absolute;inset:0;z-index:1;background:var(--inside);opacity:1;transition:opacity .3s}
.song.clip-on .clip .cover{opacity:0;transition:opacity 1.2s}
.clip .cover .vinyl{width:auto;height:78%;animation-play-state:running}
.watch{display:flex;align-items:center;justify-content:center;gap:12px;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:18px;
  background:linear-gradient(135deg,var(--door-a),var(--door-d));color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.watch .play{width:64px;height:64px;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#card-media{display:flex;flex-direction:column;gap:12px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;text-decoration:none;color:var(--ink);
  background:var(--door-b);border:2px solid var(--door-edge);font-family:var(--f-body)}
.choice:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.choice .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.choice b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.choice small{display:block;color:var(--soft);font-size:.85rem}
.vinyl-wrap{display:grid;place-items:center;padding:8px 0 4px}
.vinyl{width:min(200px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#2b201e 0 2px,#3a2c29 2px 4px);box-shadow:0 10px 24px rgba(0,0,0,.28);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(255,255,255,.10) 55deg,transparent 70deg 220deg,rgba(255,255,255,.07) 235deg,transparent 250deg)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;
  font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,4vw,1.5rem)}
.vinyl .label::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:var(--board)}
.vinyl .label span{transform:translateY(-55%)}
.song.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.song{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--door-c);border:2px solid var(--door-edge)}
.song-head{display:flex;align-items:center;gap:12px}
.song-head .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.song-head b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.song-head small{display:block;color:var(--soft);font-size:.85rem}
.song audio{width:100%;max-width:100%}
.save{align-self:flex-start;text-decoration:none;background:var(--ink);color:var(--board);font-family:var(--f-display);font-size:1rem;font-weight:500;padding:10px 18px;border-radius:999px}
.save:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.guide{border-radius:14px;background:var(--board);padding:10px 14px;font-size:.95rem}
.guide summary{cursor:pointer;font-family:var(--f-display);font-weight:500}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .once{color:var(--soft)}
.soon{aspect-ratio:16/9;width:100%;border-radius:18px;border:3px dashed var(--door-edge);display:grid;place-items:center;text-align:center;padding:16px;
  font-family:var(--f-hand);font-size:1.4rem;color:var(--soft)}

footer{text-align:center;font-family:var(--f-hand);font-size:1.25rem;color:var(--soft)}

.snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  .bulb,.door.today .leaf{animation:none}
  .leaf{transition:none}
  .card{animation:none}
  .snow{display:none}
  .vinyl{animation:none}
}
</style>
</head>
<body>


<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="lights" aria-hidden="true">
    <svg viewBox="0 0 1000 56" preserveAspectRatio="none"><path d="M0 8 Q125 44 250 14 T500 14 T750 14 T1000 8" fill="none" stroke="var(--pine)" stroke-width="2.5"/></svg>
    <div class="bulbs" id="bulbs"></div>
  </div>

  <header>
    <div class="eyebrow">für meine Lieblingsschwester</div>
    <h1>Dein Adventskalender <span class="star">✦</span></h1>
    <p class="status" id="status"></p>
  </header>

  <main class="board">
    <div class="grid" id="grid"></div>
  </main>

  <footer>Jeden Tag ein Türchen. Nicht schummeln! ♡</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="card-head">
      <div>
        <div class="date" id="card-date"></div>
        <h2 id="card-title"></h2>
      </div>
      <button class="close" id="close" aria-label="Schließen">✕</button>
    </div>
    <div id="card-media"></div>
    <p class="note" id="card-note"></p>
  </div>
</div>

<script>
/* ===== Hier die Inhalte eintragen =====
   video: ein YouTube Link (egal welches Format, z.B. https://youtu.be/abc123 oder https://www.youtube.com/watch?v=abc123)
   spotify: optional ein Spotify Link zum selben Song, z.B. https://open.spotify.com/track/...
   clip:  optional ein YouTube Link, der stumm und in Schleife zum Song läuft (statt der Schallplatte)
   titel: Name des Songs, wird in der Karte angezeigt
   song:  Name der MP3 im Ordner songs, ohne .mp3 (z.B. "t01-k7f3" für songs/t01-k7f3.mp3)
   text:  eine kleine Nachricht für den Tag (darf leer bleiben)
   Beispiel: 1: { video: "https://youtu.be/abc123", song: "t01-k7f3", text: "Hab einen schönen Tag!" }, */
const JAHR = 2026;
const TUERCHEN = {
  1:  { video: "", song: "t01-3b94657d", titel: "Lily's Theme", clip: "https://youtu.be/BWp-MmUmhbA", text: "" },
  2:  { video: "", song: "t02-8232f896", titel: "Those Eyes", text: "" },
  3:  { video: "", song: "t03-861fdead", titel: "Hobbit", clip: "https://youtu.be/chxX9uucndY", text: "" },
  4:  { video: "", song: "t04-42593136", titel: "Creep", text: "" },
  5:  { video: "", text: "" },
  6:  { video: "", text: "" },
  7:  { video: "", text: "" },
  8:  { video: "", text: "" },
  9:  { video: "", text: "" },
  10: { video: "", text: "" },
  11: { video: "", text: "" },
  12: { video: "", text: "" },
  13: { video: "", text: "" },
  14: { video: "", text: "" },
  15: { video: "", text: "" },
  16: { video: "", text: "" },
  17: { video: "", text: "" },
  18: { video: "", text: "" },
  19: { video: "", text: "" },
  20: { video: "", text: "" },
  21: { video: "", text: "" },
  22: { video: "", text: "" },
  23: { video: "", text: "" },
  24: { video: "", text: "" },
};

/* ===== ab hier nichts ändern ===== */
const ORDER = [7,15,2,20,11,24,4,18,9,13,1,22,16,6,19,3,12,23,8,14,21,5,17,10];
const BIG = new Set([24,6,12]);
const DOODLES = ["❄","✿","☆","♡","☾","✦"];
const COLORS = ["var(--door-a)","var(--door-b)","var(--door-c)","var(--door-d)"];
const PREVIEW = location.hash === "#vorschau";

function berlinNow(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=+x.value,o),{});
  return p;
}
function isOpenable(n){
  if (PREVIEW) return true;
  const t = berlinNow();
  if (t.year > JAHR) return true;
  return t.year === JAHR && t.month === 12 && t.day >= n;
}
function todayNum(){
  const t = berlinNow();
  return (t.year === JAHR && t.month === 12 && t.day <= 24) ? t.day : 0;
}
function daysUntil(n){
  const t = berlinNow();
  const now = Date.UTC(t.year,t.month-1,t.day);
  const target = Date.UTC(JAHR,11,n);
  return Math.round((target-now)/864e5);
}

let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("advent-seen")||"[]")); } catch(e){}
function markSeen(n){ seen.add(n); try{ localStorage.setItem("advent-seen",JSON.stringify([...seen])); }catch(e){} }

function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ytId(url){
  if(!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : "");
}
const CAN_EMBED = !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) && location.protocol !== "file:" ? true : false;

/* Status */
function renderStatus(){
  const s = document.getElementById("status");
  const t = berlinNow();
  if (PREVIEW){ s.innerHTML = '<span class="pill">Vorschau: alle Türchen offen</span>'; return; }
  if (t.year < JAHR || (t.year === JAHR && t.month < 12)){
    const d = daysUntil(1);
    s.innerHTML = d === 1 ? '<span class="pill">Morgen geht es los!</span>' : `Noch <span class="pill">${d} Mal schlafen</span> bis zum ersten Türchen`;
  } else if (todayNum()){
    const n = todayNum();
    s.innerHTML = n === 24 ? '<span class="pill">Frohe Weihnachten! ♡</span>' : `Heute ist <span class="pill">Türchen ${n}</span> dran`;
  } else {
    s.innerHTML = '<span class="pill">Alle Türchen sind offen ♡</span>';
  }
}

/* Türchen */
const grid = document.getElementById("grid");
ORDER.forEach((n,i)=>{
  const b = document.createElement("button");
  b.className = "door" + (BIG.has(n) ? " big" : "");
  b.dataset.n = n;
  b.style.setProperty("--dc", COLORS[(i*3+n)%4]);
  b.innerHTML = `<div class="inside"><span>${["🎄","☕","🍪","🧦","🎁","⭐","🕯️","🦌"][n%8]}</span></div>
    <div class="leaf"><span class="num">${n}</span><span class="doodle">${DOODLES[n%6]}</span></div>`;
  grid.appendChild(b);
});
function refreshDoors(){
  const today = todayNum();
  grid.querySelectorAll(".door").forEach(b=>{
    const n = +b.dataset.n, ok = isOpenable(n);
    b.classList.toggle("locked", !ok);
    b.classList.toggle("opened", ok && seen.has(n));
    b.classList.toggle("today", !PREVIEW && n === today && !seen.has(n));
    b.setAttribute("aria-label", ok ? `Türchen ${n} öffnen` : `Türchen ${n}, noch geschlossen`);
  });
}

let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"),2600);
}

grid.addEventListener("click", e=>{
  const b = e.target.closest(".door"); if(!b) return;
  const n = +b.dataset.n;
  if(!isOpenable(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const d = daysUntil(n);
    toast(d === 1 ? `Türchen ${n} darfst du morgen öffnen ♡` : `Geduld! Noch ${d} Mal schlafen bis Türchen ${n}`);
    return;
  }
  b.classList.add("open");
  markSeen(n);
  setTimeout(()=>{ showCard(n); refreshDoors(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550);
});

/* Karte */
const scrim = document.getElementById("scrim");
let lastDoor = null;
function showCard(n){
  lastDoor = grid.querySelector(`.door[data-n="${n}"]`);
  const item = TUERCHEN[n] || {};
  document.getElementById("card-date").textContent = `${n}. Dezember`;
  document.getElementById("card-title").textContent = `Türchen ${n}`;
  const media = document.getElementById("card-media");
  const id = ytId(item.video);
  const sp = (item.spotify || "").trim();
  const song = (item.song || "").replace(/[^A-Za-z0-9_-]/g,"");
  const clipId = CAN_EMBED ? ytId(item.clip) : "";
  if(!id && !sp && !song){
    media.innerHTML = '<div class="soon">Hier versteckt sich bald eine Überraschung ✿</div>';
  } else {
    let html = "";
    if(id && CAN_EMBED){
      html += `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Video zu Türchen ${n}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    } else if(id){
      html += `<a class="watch" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="play">▶</span>Video ansehen</a>`;
    }
    if(sp){
      html += `<div class="choices"><a class="choice spotify" href="${sp.replace(/"/g,'')}" target="_blank" rel="noopener"><span class="ico">♫</span><span><b>Auf Spotify anhören</b><small>perfekt für die Fahrt zur Arbeit</small></span></a></div>`;
    }
    if(song){
      html += `<div class="song">
        <div class="song-head"><span class="ico">♫</span><span><b>${item.titel ? esc(item.titel) : "Der Song von heute"}</b><small>gespielt von Arne ♡ zum Anhören oder für die Fahrt zur Arbeit</small></span></div>
        ${clipId ? `<div class="video clip"><div class="yt" data-clip="${clipId}"></div><div class="vinyl-wrap cover" aria-hidden="true"><div class="vinyl"><div class="label"><span>${n}</span></div></div></div></div>` : ""}
        ${!id && !clipId ? `<div class="vinyl-wrap"><div class="vinyl" aria-hidden="true"><div class="label"><span>${n}</span></div></div></div>` : ""}
        <audio controls preload="none" src="songs/${song}.mp3"></audio>
        <a class="save" href="songs/${song}.mp3" download="${item.titel ? esc(item.titel) : "Tuerchen " + n}.mp3">↓ Song speichern</a>
        <details class="guide"><summary>So landet der Song in deinem Spotify</summary><ol>
          <li class="once">Nur beim ersten Mal: In Spotify auf dein Profilbild tippen, dann Einstellungen und Datenschutz › Apps und Geräte › „Lokale Audiodateien“ einschalten.</li>
          <li>Hier auf „Song speichern“ tippen und mit „Laden“ bestätigen.</li>
          <li>Die App Dateien öffnen und im Ordner Downloads den Song gedrückt halten › Bewegen.</li>
          <li>„Auf meinem iPhone“ › Ordner „Spotify“ wählen und auf Bewegen tippen.</li>
          <li>In Spotify unter Bibliothek › Lokale Dateien ist er jetzt da und läuft auch ohne Internet. ♫</li>
        </ol></details>
      </div>`;
    }
    media.innerHTML = html;
    const yt = media.querySelector(".yt");
    if(yt) initClip(yt);
  }
  const note = document.getElementById("card-note");
  note.textContent = item.text || "";
  note.hidden = !item.text;
  scrim.hidden = false;
  document.getElementById("close").focus();
}
function closeCard(){
  scrim.hidden = true;
  try{ if(clipPlayer) clipPlayer.destroy(); }catch(e){}
  clipPlayer = null; clipReady = false;
  document.getElementById("card-media").innerHTML = "";
  if(lastDoor){ lastDoor.classList.remove("open"); lastDoor.focus(); }
}
document.getElementById("close").addEventListener("click", closeCard);
const cm = document.getElementById("card-media");
["play","pause","ended"].forEach(ev=>cm.addEventListener(ev, e=>{
  const box = e.target.closest && e.target.closest(".song");
  if(!box) return;
  box.classList.toggle("playing", ev === "play");
  if(ev !== "play") box.classList.remove("clip-on");
  if(clipPlayer && clipReady){
    try{ if(ev === "play"){ clipPlayer.mute(); clipPlayer.playVideo(); } else clipPlayer.pauseVideo(); }catch(err){}
  }
}, true));
scrim.addEventListener("click", e=>{ if(e.target === scrim) closeCard(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && !scrim.hidden) closeCard(); });

/* Clip (YouTube Player, stumm im Hintergrund) */
let clipPlayer = null, clipReady = false, ytApi = null, clipShowT = null;
/* kurz vor Ende zurückspringen, damit YouTube kein Endbild und keinen Titel zeigt */
setInterval(()=>{
  try{
    if(!clipPlayer || !clipReady || clipPlayer.getPlayerState() !== 1) return;
    const d = clipPlayer.getDuration(), t = clipPlayer.getCurrentTime();
    if(d > 2 && d - t < 1.2) clipPlayer.seekTo(0, true);
  }catch(e){}
}, 250);
function loadYtApi(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res=>{
    if(window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prev) prev(); res(window.YT); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function initClip(el){
  const vid = el.dataset.clip, box = el.closest(".song");
  clipPlayer = null; clipReady = false;
  loadYtApi().then(YT=>{
    if(!document.body.contains(el)) return;
    clipPlayer = new YT.Player(el, {
      host: "https://www.youtube-nocookie.com",
      videoId: vid,
      playerVars: { mute:1, controls:0, loop:1, playlist:vid, playsinline:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, modestbranding:1 },
      events: {
        onReady: e=>{
          clipReady = true; e.target.mute();
          if(box.classList.contains("playing")) e.target.playVideo();
        },
        onStateChange: e=>{
          clearTimeout(clipShowT);
          if(e.data === 1 && box.classList.contains("playing")){
            clipShowT = setTimeout(()=>{ if(box.classList.contains("playing")) box.classList.add("clip-on"); }, 3000);
          } else if(e.data === 2 || e.data === 0) box.classList.remove("clip-on");
        }
      }
    });
  });
}

/* Lichterkette */
const bulbs = document.getElementById("bulbs");
const bc = ["var(--berry)","var(--honey)","var(--pine)","#f6a6b2","var(--honey)"];
for(let i=0;i<14;i++){
  const s = document.createElement("span"); s.className = "bulb";
  const x = (i+0.5)/14;
  s.style.setProperty("--y", (14 + 16*Math.abs(Math.sin(x*Math.PI*4))) + "px");
  s.style.setProperty("--c", bc[i%bc.length]);
  s.style.setProperty("--d", (i*0.37%2.6) + "s");
  bulbs.appendChild(s);
}

/* Schnee */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  let w,h,flakes=[];
  function size(){ w=c.width=innerWidth; h=c.height=innerHeight; }
  size(); addEventListener("resize", size);
  for(let i=0;i<60;i++) flakes.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.6,s:.3+Math.random()*.8,o:Math.random()*6});
  function tick(t){
    ctx.clearRect(0,0,w,h);
    const col = getComputedStyle(document.documentElement).getPropertyValue("--soft").trim() || "#9a7469";
    ctx.fillStyle = col; ctx.globalAlpha = .35;
    for(const f of flakes){
      f.y += f.s; f.x += Math.sin(t/1400 + f.o)*.3;
      if(f.y > h+5){ f.y = -5; f.x = Math.random()*w; }
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

renderStatus(); refreshDoors();
setInterval(()=>{ renderStatus(); refreshDoors(); }, 60000);
addEventListener("hashchange", ()=>location.reload());
