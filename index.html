<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adventskalender für dich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Gochi+Hand&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: oben die Wand mit Fenster (Ausblick = Foto des Tages) und Papierstern, darunter die Holztreppe im Zickzack vor der Apricotwand, auf jeder Stufe eine gestreifte Papiertüte */
:root{
  --wall:#f5efe7; --apricot:#f1c49a; --apricot-2:#ebb789;
  --beech:#dca36a; --beech-light:#e9bb84; --beech-dark:#b67c45;
  --steel:#a9b0b7; --floor:#c48a54;
  --ink:#4a3128; --soft:#8a6a5d; --board:#fff8f1; --berry:#c9566b; --pine:#3f6f57; --honey:#d9a441;
  --door-a:#f0c9c0; --door-b:#cfe0d2; --door-c:#f5ddb0; --door-d:#e7d3ea; --door-edge:rgba(90,58,49,.18); --inside:#3b2a24;
  --shadow:0 10px 30px rgba(90,55,30,.18);
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--wall)}
[hidden]{display:none!important}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:hidden}

/* Wand oben */
.wall{position:relative;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(28px,5vw,56px) 28px;
  background:radial-gradient(90% 70% at 70% 30%,rgba(255,226,180,.55),transparent 70%),var(--wall)}
.wall-inner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);align-items:center}
@media (max-width:720px){.wall-inner{grid-template-columns:1fr}}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--f-hand);font-size:1.45rem;color:var(--berry);transform:rotate(-2deg);transform-origin:left}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,5.5vw,3.4rem);line-height:1.05;margin:0;text-wrap:balance}
.status{font-family:var(--f-display);font-size:1.02rem;color:var(--soft);margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:2px dashed var(--door-edge);border-radius:999px;padding:3px 14px;color:var(--ink)}

/* Fenster mit Ausblick */
.window{position:relative;justify-self:center;width:min(100%,440px);aspect-ratio:4/3.3;padding:14px;border-radius:6px;
  background:linear-gradient(180deg,var(--beech-light),var(--beech));box-shadow:0 18px 40px rgba(90,55,30,.25),inset 0 0 0 2px rgba(255,255,255,.25)}
.window .view{position:absolute;inset:14px;overflow:hidden;border-radius:2px;
  background:radial-gradient(120% 90% at 50% 10%,#9fb6cf 0%,#5e7a99 45%,#2f3e55 100%)}
.window .view .layer{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.03)}
.window .view .layer.on{opacity:1}
.window .view::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18) 0 18%,transparent 30% 60%,rgba(255,255,255,.08) 70%,transparent 80%);pointer-events:none}
.window .bars{position:absolute;inset:14px;pointer-events:none}
.window .bars::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:linear-gradient(90deg,var(--beech-dark),var(--beech-light) 40%,var(--beech))}
.window .bars::after{content:"";position:absolute;left:0;right:0;top:44%;height:12px;background:linear-gradient(180deg,var(--beech-light),var(--beech) 60%,var(--beech-dark))}
.window .curtain{position:absolute;top:4px;bottom:22px;right:6px;width:30%;border-radius:0 0 8px 40%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.62) 0 7px,rgba(255,255,255,.42) 7px 14px);box-shadow:-4px 0 12px rgba(0,0,0,.06);pointer-events:none}
.window .sill{position:absolute;left:-14px;right:-14px;bottom:-10px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--beech-light),var(--beech-dark));box-shadow:0 6px 12px rgba(90,55,30,.2)}
.window .light{position:absolute;inset:-40%;background:radial-gradient(closest-side,rgba(255,236,200,.5),transparent);z-index:-1;pointer-events:none}

/* Papierstern */
.star{position:absolute;left:-6%;top:-26px;width:clamp(70px,13vw,110px);z-index:3;pointer-events:none;animation:sway 7s ease-in-out infinite;transform-origin:50% 0}
.star::before{content:"";position:absolute;left:50%;top:-60px;height:62px;width:1px;background:rgba(80,60,50,.5)}
.star svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 18px rgba(255,214,140,.85)) drop-shadow(0 0 4px rgba(255,240,210,.9))}
@keyframes sway{50%{transform:rotate(3deg)}}

/* Treppe */
.stairwell{position:relative;overflow-x:clip;background:linear-gradient(180deg,var(--apricot) 0%,var(--apricot-2) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 0;
  box-shadow:inset 0 14px 18px -12px rgba(120,70,30,.25)}
.stairwell::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(180deg,var(--beech-light),var(--beech));box-shadow:0 3px 6px rgba(90,55,30,.2)}
#grid{position:relative;max-width:980px;margin:0 auto}
.flight{position:relative}
.plank{position:absolute;background:linear-gradient(180deg,var(--beech-light) 0%,var(--beech) 55%,var(--beech-dark) 100%);border-radius:2px}
.plank.tread::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(180deg,rgba(90,50,20,.22),transparent)}
.plank.riser{background:linear-gradient(90deg,var(--beech-dark),var(--beech) 40%,var(--beech-light))}
.plank.landing{border-radius:0}
.rail{position:absolute;inset:0;pointer-events:none;overflow:visible}
.floor{height:44px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;background:repeating-linear-gradient(90deg,#c58b55 0 70px,#b97d48 70px 72px,#cf9862 72px 150px,#b97d48 150px 152px);box-shadow:inset 0 10px 14px -8px rgba(60,30,10,.35)}

/* Papiertüten */
.door{position:absolute;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 6px 6px rgba(70,35,15,.25));transform-origin:50% 100%}
.door > *{pointer-events:none}
.door:focus-visible{outline:3px solid var(--berry);outline-offset:4px;border-radius:6px}
.bag{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.bag::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.2))}
.s0 .bag{background:repeating-linear-gradient(90deg,#b4502f 0 9px,#f1e4d1 9px 18px)}
.s1 .bag{background:repeating-linear-gradient(90deg,#211c1a 0 8px,#eedfc8 8px 16px)}
.s2 .bag{background:repeating-linear-gradient(90deg,#1f7a52 0 10px,#155a3c 10px 14px,#1f7a52 14px 22px,#2b8c61 22px 24px)}
.fold{position:absolute;left:9%;right:9%;top:0;height:13%;background:rgba(0,0,0,.18);box-shadow:inset 0 -2px 0 rgba(255,255,255,.15)}
.sticker{position:absolute;left:50%;top:52%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#16120f;color:#fff;
  display:grid;place-items:center;font-family:var(--f-hand);font-size:var(--fs,1.4rem);line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.bclip{position:absolute;left:50%;top:-9%;width:30%;height:17%;transform:translateX(-50%);transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.bclip::before{content:"";position:absolute;left:12%;right:12%;top:0;height:62%;border:2px solid #c99a34;border-bottom:0;border-radius:6px 6px 0 0}
.bclip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;border-radius:2px;background:linear-gradient(180deg,#f3d27a,#c99a34 60%,#a67c22);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.door.open .bclip,.door.opened .bclip{transform:translate(-50%,-160%) rotate(-28deg);opacity:0}
.door.opened .fold{background:#2b1f1a;height:9%;top:-1%;box-shadow:inset 0 4px 6px rgba(0,0,0,.5)}
.door.opened .sticker{opacity:.85}
.door.open{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-8%) rotate(-3deg)}}
.door.today{animation:bob 2.6s ease-in-out infinite}
.door.today .sticker{box-shadow:0 0 0 3px #f3d27a,0 0 14px rgba(243,210,122,.9)}
@keyframes bob{50%{transform:translateY(-4%)}}
.door.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.door.locked .bag{filter:saturate(.85)}

footer{text-align:center;font-family:var(--f-hand);font-size:1.25rem;color:#fff8f1;background:#8f5f37;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--board);font-family:var(--f-display);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Karte */
.scrim{position:fixed;inset:0;background:rgba(40,20,18,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--board);border-radius:26px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;border:3px solid var(--door-edge);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.8rem;margin:0}
.card .date{font-family:var(--f-hand);font-size:1.25rem;color:var(--berry)}
.close{border:0;background:var(--door-a);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.close:focus-visible,.watch:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.note{font-family:var(--f-hand);font-size:1.45rem;line-height:1.35;margin:0;color:var(--ink)}
.video{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:18px;overflow:hidden;background:var(--inside);border:0}
.video iframe{width:100%;height:100%;border:0;display:block}
.clip{position:relative;overflow:hidden;isolation:isolate}
.clip iframe{position:absolute;inset:0;pointer-events:none;transform:scale(1.42);opacity:0;transition:opacity .3s}
.song.clip-on .clip iframe{opacity:1;transition:opacity 1.2s}
.clip::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 18px rgba(30,20,19,.55);border-radius:inherit;z-index:2}
.clip .cover{position:absolute;inset:0;z-index:1;background:var(--inside);opacity:1;transition:opacity .3s}
.song.clip-on .clip .cover{opacity:0;transition:opacity 1.2s}
.clip .cover .vinyl{width:auto;height:78%;animation-play-state:running}
.watch{display:flex;align-items:center;justify-content:center;gap:12px;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:18px;
  background:linear-gradient(135deg,var(--door-a),var(--door-d));color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.watch .play{width:64px;height:64px;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#card-media{display:flex;flex-direction:column;gap:12px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;text-decoration:none;color:var(--ink);
  background:var(--door-b);border:2px solid var(--door-edge);font-family:var(--f-body)}
.choice:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.choice .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.choice b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.choice small{display:block;color:var(--soft);font-size:.85rem}
.vinyl-wrap{display:grid;place-items:center;padding:8px 0 4px}
.vinyl{width:min(200px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#2b201e 0 2px,#3a2c29 2px 4px);box-shadow:0 10px 24px rgba(0,0,0,.28);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(255,255,255,.10) 55deg,transparent 70deg 220deg,rgba(255,255,255,.07) 235deg,transparent 250deg)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;
  font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,4vw,1.5rem)}
.vinyl .label::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:var(--board)}
.vinyl .label span{transform:translateY(-55%)}
.song.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.song{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--door-c);border:2px solid var(--door-edge)}
.song-head{display:flex;align-items:center;gap:12px}
.song-head .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.song-head b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.song-head small{display:block;color:var(--soft);font-size:.85rem}
.song audio{width:100%;max-width:100%}
.save{align-self:flex-start;text-decoration:none;background:var(--ink);color:var(--board);font-family:var(--f-display);font-size:1rem;font-weight:500;padding:10px 18px;border-radius:999px}
.save:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.guide{border-radius:14px;background:var(--board);padding:10px 14px;font-size:.95rem}
.guide summary{cursor:pointer;font-family:var(--f-display);font-weight:500}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .once{color:var(--soft)}
.soon{aspect-ratio:16/9;width:100%;border-radius:18px;border:3px dashed var(--door-edge);display:grid;place-items:center;text-align:center;padding:16px;
  font-family:var(--f-hand);font-size:1.4rem;color:var(--soft)}

footer{}
@media (prefers-reduced-motion:reduce){
  .star,.door.today,.door.open{animation:none}
  .bclip,.window .view .layer{transition:none}
  .card{animation:none}
  .vinyl{animation:none}
}
</style>
</head>
<body>


<div class="wall">
  <div class="wall-inner">
    <header>
      <div class="eyebrow">für meine Lieblingsschwester</div>
      <h1>Dein Adventskalender</h1>
      <p class="status" id="status"></p>
    </header>
    <div class="window" aria-hidden="true">
      <div class="light"></div>
      <div class="view" id="bg"><div class="layer"></div><div class="layer"></div></div>
      <div class="bars"></div>
      <div class="curtain"></div>
      <div class="sill"></div>
      <div class="star"><svg viewBox="-50 -50 100 100" aria-hidden="true"><polygon fill="#fff6e4" stroke="#f1dcb4" stroke-width="1" points="0.0,-46.0 6.9,-16.6 32.5,-32.5 16.6,-6.9 46.0,-0.0 16.6,6.9 32.5,32.5 6.9,16.6 0.0,46.0 -6.9,16.6 -32.5,32.5 -16.6,6.9 -46.0,0.0 -16.6,-6.9 -32.5,-32.5 -6.9,-16.6"/><circle r="5" fill="#ffe9b8"/></svg></div>
    </div>
  </div>
</div>

<main class="stairwell">
  <div id="grid"></div>
  <div class="floor"></div>
</main>

<footer>Jeden Tag eine Tüte. Nicht schummeln! ♡</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="card-head">
      <div>
        <div class="date" id="card-date"></div>
        <h2 id="card-title"></h2>
      </div>
      <button class="close" id="close" aria-label="Schließen">✕</button>
    </div>
    <div id="card-media"></div>
    <p class="note" id="card-note"></p>
  </div>
</div>

<script>
/* ===== Hier die Inhalte eintragen =====
   video: ein YouTube Link (egal welches Format, z.B. https://youtu.be/abc123 oder https://www.youtube.com/watch?v=abc123)
   spotify: optional ein Spotify Link zum selben Song, z.B. https://open.spotify.com/track/...
   clip:  optional ein YouTube Link, der stumm und in Schleife zum Song läuft (statt der Schallplatte)
   bild:  Foto für diesen Tag (siehe oben)
   titel: Name des Songs, wird in der Karte angezeigt
   song:  Name der MP3 im Ordner songs, ohne .mp3 (z.B. "t01-k7f3" für songs/t01-k7f3.mp3)
   text:  eine kleine Nachricht für den Tag (darf leer bleiben)
   Beispiel: 1: { video: "https://youtu.be/abc123", song: "t01-k7f3", text: "Hab einen schönen Tag!" }, */
const JAHR = 2026;
/* bild: ein Foto pro Tag im Ordner bilder, z.B. "bilder/01.jpg". An diesem Dezembertag ist es der Hintergrund,
   und beim Öffnen eines älteren Türchens kommt sein Foto zurück. START_BILD ist der Hintergrund vor dem 1. Dezember. */
const START_BILD = "";
const TUERCHEN = {
  1:  { video: "", song: "t01-3b94657d", titel: "Lily's Theme", bild: "bilder/b01-796fcd1e.jpg", clip: "https://youtu.be/BWp-MmUmhbA", text: "" },
  2:  { video: "", song: "t02-3147c97f", titel: "Those Eyes", clip: "https://youtu.be/memUamSICTc", text: "" },
  3:  { video: "", song: "t03-861fdead", titel: "Hobbit", bild: "bilder/b03-7ad789f9.jpg", clip: "https://youtu.be/chxX9uucndY", text: "" },
  4:  { video: "", song: "t04-42593136", titel: "Creep", text: "" },
  5:  { video: "", text: "" },
  6:  { video: "", text: "" },
  7:  { video: "", text: "" },
  8:  { video: "", text: "" },
  9:  { video: "", text: "" },
  10: { video: "", text: "" },
  11: { video: "", text: "" },
  12: { video: "", text: "" },
  13: { video: "", text: "" },
  14: { video: "", text: "" },
  15: { video: "", text: "" },
  16: { video: "", text: "" },
  17: { video: "", text: "" },
  18: { video: "", text: "" },
  19: { video: "", text: "" },
  20: { video: "", text: "" },
  21: { video: "", text: "" },
  22: { video: "", text: "" },
  23: { video: "", text: "" },
  24: { video: "", text: "" },
};

/* ===== ab hier nichts ändern ===== */
const ORDER = [7,15,2,20,11,24,4,18,9,13,1,22,16,6,19,3,12,23,8,14,21,5,17,10];
const BIG = new Set([24,6,12]);
const DOODLES = ["❄","✿","☆","♡","☾","✦"];
const COLORS = ["var(--door-a)","var(--door-b)","var(--door-c)","var(--door-d)"];
const PREVIEW = location.hash === "#vorschau";

function berlinNow(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=+x.value,o),{});
  return p;
}
function isOpenable(n){
  if (PREVIEW) return true;
  const t = berlinNow();
  if (t.year > JAHR) return true;
  return t.year === JAHR && t.month === 12 && t.day >= n;
}
function todayNum(){
  const t = berlinNow();
  return (t.year === JAHR && t.month === 12 && t.day <= 24) ? t.day : 0;
}
function daysUntil(n){
  const t = berlinNow();
  const now = Date.UTC(t.year,t.month-1,t.day);
  const target = Date.UTC(JAHR,11,n);
  return Math.round((target-now)/864e5);
}

let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("advent-seen")||"[]")); } catch(e){}
function markSeen(n){ seen.add(n); try{ localStorage.setItem("advent-seen",JSON.stringify([...seen])); }catch(e){} }

function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ytId(url){
  if(!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : "");
}
const CAN_EMBED = !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) && location.protocol !== "file:" ? true : false;

/* Hintergrund */
const bgLayers = [...document.querySelectorAll("#bg .layer")];
let bgIdx = 0, bgCurrent = null, bgPicked = false;
function setBg(url){
  if(url === bgCurrent) return;
  bgCurrent = url;
  const next = bgLayers[1 - bgIdx], cur = bgLayers[bgIdx];
  if(!url){ cur.classList.remove("on"); document.documentElement.classList.remove("has-photo"); return; }
  const img = new Image();
  img.onload = ()=>{ if(bgCurrent !== url) return; next.style.backgroundImage = `url("${url}")`; next.classList.add("on"); cur.classList.remove("on"); bgIdx = 1 - bgIdx; document.documentElement.classList.add("has-photo"); };
  img.src = url;
}
function homeBg(){
  const t = berlinNow();
  const last = (t.year > JAHR || (t.year === JAHR && t.month === 12)) ? (t.year > JAHR ? 24 : Math.min(t.day,24)) : 0;
  for(let d = last; d >= 1; d--){ const bi = (TUERCHEN[d] || {}).bild; if(bi) return bi; }
  return START_BILD;
}

/* Status */
function renderStatus(){
  const s = document.getElementById("status");
  const t = berlinNow();
  if (PREVIEW){ s.innerHTML = '<span class="pill">Vorschau: alle Türchen offen</span>'; return; }
  if (t.year < JAHR || (t.year === JAHR && t.month < 12)){
    const d = daysUntil(1);
    s.innerHTML = d === 1 ? '<span class="pill">Morgen geht es los!</span>' : `Noch <span class="pill">${d} Mal schlafen</span> bis zum ersten Türchen`;
  } else if (todayNum()){
    const n = todayNum();
    s.innerHTML = n === 24 ? '<span class="pill">Frohe Weihnachten! ♡</span>' : `Heute ist <span class="pill">Türchen ${n}</span> dran`;
  } else {
    s.innerHTML = '<span class="pill">Alle Türchen sind offen ♡</span>';
  }
}

/* Treppe mit Tüten */
const grid = document.getElementById("grid");
const BAGS = ORDER.map((n,i)=>{
  const b = document.createElement("button");
  b.className = "door s" + ((n*7+i)%3);
  b.dataset.n = n;
  b.dataset.h = (1.12 + ((n*13)%5)*0.06).toFixed(2);
  b.innerHTML = `<span class="bag"></span><span class="fold"></span><span class="sticker">${n}</span><span class="bclip"></span>`;
  return b;
});
let lastW = 0;
function buildStairs(){
  const W = grid.clientWidth; if(!W || W === lastW) return; lastW = W;
  const per = W < 560 ? 4 : W < 860 ? 6 : 8;
  const flights = Math.ceil(24 / per);
  const run = W / per, rise = run * 0.5, t = Math.max(8, run * 0.09);
  const bagW = Math.min(run * 0.66, 120);
  const maxH = bagW * 1.36;
  const railUp = maxH + bagW * 0.45 + 12;
  grid.innerHTML = "";
  let idx = 0;
  for(let f = 0; f < flights; f++){
    const ltr = f % 2 === 1;               // abwechselnd nach rechts und nach links
    const H = per * rise + t + railUp + 18;
    const fl = document.createElement("div"); fl.className = "flight"; fl.style.height = H + "px";
    const xOf = k => ltr ? k * run : W - (k + 1) * run;
    // Geländer: Stahlseile hinter den Tüten
    const pts = k => { const x = xOf(k) + run/2; return [x, H - ((k + 1) * rise + t)]; };
    const [x0,y0] = pts(0), [x1,y1] = pts(per - 1);
    let svgBack = `<svg class="rail" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="z-index:0">`;
    for(let c = 1; c <= 4; c++){ const o = railUp * c / 5; svgBack += `<line x1="${x0}" y1="${y0 - o}" x2="${x1}" y2="${y1 - o}" stroke="var(--steel)" stroke-width="2" opacity=".75"/>`; }
    svgBack += `<line x1="${x0}" y1="${y0 - 6}" x2="${x0}" y2="${y0 - railUp}" stroke="var(--steel)" stroke-width="5"/><line x1="${x1}" y1="${y1 - 6}" x2="${x1}" y2="${y1 - railUp}" stroke="var(--steel)" stroke-width="5"/></svg>`;
    fl.insertAdjacentHTML("beforeend", svgBack);
    for(let k = 0; k < per; k++){
      const x = xOf(k), top = H - (k + 1) * rise - t;
      const tr = document.createElement("div"); tr.className = "plank tread";
      Object.assign(tr.style,{left:(ltr ? x : x - t) + "px", top: top + "px", width:(run + t) + "px", height: t + "px", zIndex: 2});
      const rs = document.createElement("div"); rs.className = "plank riser";
      Object.assign(rs.style,{left:(ltr ? x : x + run - t) + "px", top:(top + t) + "px", width: t + "px", height:(rise - t) + "px", zIndex: 2});
      fl.append(tr, rs);
      const b = BAGS[idx++];
      if(b){
        const h = bagW * +b.dataset.h;
        Object.assign(b.style,{left:(x + (run - bagW)/2) + "px", top:(top - h) + "px", width: bagW + "px", height: h + "px", zIndex: 3});
        b.style.setProperty("--fs", (bagW * 0.24) + "px");
        fl.appendChild(b);
      }
    }
    // Handlauf aus Holz vor den Tüten
    fl.insertAdjacentHTML("beforeend", `<svg class="rail" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="z-index:4"><line x1="${x0 - (ltr?run*.3:-run*.3)}" y1="${y0 - railUp + rise*.3}" x2="${x1 + (ltr?run*.3:-run*.3)}" y2="${y1 - railUp - rise*.3}" stroke="var(--beech-dark)" stroke-width="${Math.max(6,t*.8)}" stroke-linecap="round"/><line x1="${x0 - (ltr?run*.3:-run*.3)}" y1="${y0 - railUp + rise*.3 - 2}" x2="${x1 + (ltr?run*.3:-run*.3)}" y2="${y1 - railUp - rise*.3 - 2}" stroke="var(--beech-light)" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>`);
    // Podest unter jedem Lauf
    const ld = document.createElement("div"); ld.className = "plank landing";
    Object.assign(ld.style,{left:(ltr ? 0 : W - run*1.15) + "px", width:(run*1.15) + "px", bottom:0, height:t + "px", zIndex:2});
    fl.appendChild(ld);
    grid.appendChild(fl);
  }
  // oberster Lauf zuerst sichtbar: Läufe von oben (höchste Stufen) nach unten
  [...grid.children].reverse().forEach(c => grid.appendChild(c));
}
buildStairs();
let rzT; addEventListener("resize", ()=>{ clearTimeout(rzT); rzT = setTimeout(buildStairs, 150); });
function refreshDoors(){
  const today = todayNum();
  grid.querySelectorAll(".door").forEach(b=>{
    const n = +b.dataset.n, ok = isOpenable(n);
    b.classList.toggle("locked", !ok);
    b.classList.toggle("opened", ok && seen.has(n));
    b.classList.toggle("today", !PREVIEW && n === today && !seen.has(n));
    b.setAttribute("aria-label", ok ? `Tüte ${n} öffnen` : `Tüte ${n}, noch zu`);
  });
}

let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"),2600);
}

grid.addEventListener("click", e=>{
  const b = e.target.closest(".door"); if(!b) return;
  const n = +b.dataset.n;
  if(!isOpenable(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const d = daysUntil(n);
    toast(d === 1 ? `Türchen ${n} darfst du morgen öffnen ♡` : `Geduld! Noch ${d} Mal schlafen bis Türchen ${n}`);
    return;
  }
  b.classList.add("open");
  markSeen(n);
  setTimeout(()=>{ showCard(n); refreshDoors(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550);
});

/* Karte */
const scrim = document.getElementById("scrim");
let lastDoor = null;
function showCard(n){
  lastDoor = grid.querySelector(`.door[data-n="${n}"]`);
  const item = TUERCHEN[n] || {};
  document.getElementById("card-date").textContent = `${n}. Dezember`;
  document.getElementById("card-title").textContent = `Türchen ${n}`;
  const media = document.getElementById("card-media");
  const id = ytId(item.video);
  const sp = (item.spotify || "").trim();
  const song = (item.song || "").replace(/[^A-Za-z0-9_-]/g,"");
  const clipId = CAN_EMBED ? ytId(item.clip) : "";
  if(!id && !sp && !song){
    media.innerHTML = '<div class="soon">Hier versteckt sich bald eine Überraschung ✿</div>';
  } else {
    let html = "";
    if(id && CAN_EMBED){
      html += `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Video zu Türchen ${n}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    } else if(id){
      html += `<a class="watch" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="play">▶</span>Video ansehen</a>`;
    }
    if(sp){
      html += `<div class="choices"><a class="choice spotify" href="${sp.replace(/"/g,'')}" target="_blank" rel="noopener"><span class="ico">♫</span><span><b>Auf Spotify anhören</b><small>perfekt für die Fahrt zur Arbeit</small></span></a></div>`;
    }
    if(song){
      html += `<div class="song">
        <div class="song-head"><span class="ico">♫</span><span><b>${item.titel ? esc(item.titel) : "Der Song von heute"}</b><small>gespielt von Arne ♡ zum Anhören oder für die Fahrt zur Arbeit</small></span></div>
        ${clipId ? `<div class="video clip"><div class="yt" data-clip="${clipId}"></div><div class="vinyl-wrap cover" aria-hidden="true"><div class="vinyl"><div class="label"><span>${n}</span></div></div></div></div>` : ""}
        ${!id && !clipId ? `<div class="vinyl-wrap"><div class="vinyl" aria-hidden="true"><div class="label"><span>${n}</span></div></div></div>` : ""}
        <audio controls preload="none" src="songs/${song}.mp3"></audio>
        <a class="save" href="songs/${song}.mp3" download="${item.titel ? esc(item.titel) : "Tuerchen " + n}.mp3">↓ Song speichern</a>
        <details class="guide"><summary>So landet der Song in deinem Spotify</summary><ol>
          <li class="once">Nur beim ersten Mal: In Spotify auf dein Profilbild tippen, dann Einstellungen und Datenschutz › Apps und Geräte › „Lokale Audiodateien“ einschalten.</li>
          <li>Hier auf „Song speichern“ tippen und mit „Laden“ bestätigen.</li>
          <li>Die App Dateien öffnen und im Ordner Downloads den Song gedrückt halten › Bewegen.</li>
          <li>„Auf meinem iPhone“ › Ordner „Spotify“ wählen und auf Bewegen tippen.</li>
          <li>In Spotify unter Bibliothek › Lokale Dateien ist er jetzt da und läuft auch ohne Internet. ♫</li>
        </ol></details>
      </div>`;
    }
    media.innerHTML = html;
    const yt = media.querySelector(".yt");
    if(yt) initClip(yt);
  }
  const note = document.getElementById("card-note");
  note.textContent = item.text || "";
  note.hidden = !item.text;
  if(item.bild){ setBg(item.bild); bgPicked = true; }
  scrim.hidden = false;
  document.getElementById("close").focus();
}
function closeCard(){
  scrim.hidden = true;
  try{ if(clipPlayer) clipPlayer.destroy(); }catch(e){}
  clipPlayer = null; clipReady = false;
  document.getElementById("card-media").innerHTML = "";
  if(lastDoor){ lastDoor.classList.remove("open"); lastDoor.focus(); }
}
document.getElementById("close").addEventListener("click", closeCard);
const cm = document.getElementById("card-media");
["play","pause","ended"].forEach(ev=>cm.addEventListener(ev, e=>{
  const box = e.target.closest && e.target.closest(".song");
  if(!box) return;
  box.classList.toggle("playing", ev === "play");
  if(ev !== "play") box.classList.remove("clip-on");
  if(clipPlayer && clipReady){
    try{ if(ev === "play"){ clipPlayer.mute(); clipPlayer.playVideo(); } else clipPlayer.pauseVideo(); }catch(err){}
  }
}, true));
scrim.addEventListener("click", e=>{ if(e.target === scrim) closeCard(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && !scrim.hidden) closeCard(); });

/* Clip (YouTube Player, stumm im Hintergrund) */
let clipPlayer = null, clipReady = false, ytApi = null, clipShowT = null;
/* kurz vor Ende zurückspringen, damit YouTube kein Endbild und keinen Titel zeigt */
setInterval(()=>{
  try{
    if(!clipPlayer || !clipReady || clipPlayer.getPlayerState() !== 1) return;
    const d = clipPlayer.getDuration(), t = clipPlayer.getCurrentTime();
    if(d > 2 && d - t < 1.2) clipPlayer.seekTo(0, true);
  }catch(e){}
}, 250);
function loadYtApi(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res=>{
    if(window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prev) prev(); res(window.YT); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function initClip(el){
  const vid = el.dataset.clip, box = el.closest(".song");
  clipPlayer = null; clipReady = false;
  loadYtApi().then(YT=>{
    if(!document.body.contains(el)) return;
    clipPlayer = new YT.Player(el, {
      host: "https://www.youtube-nocookie.com",
      videoId: vid,
      playerVars: { mute:1, controls:0, loop:1, playlist:vid, playsinline:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, modestbranding:1 },
      events: {
        onReady: e=>{
          clipReady = true; e.target.mute();
          if(box.classList.contains("playing")) e.target.playVideo();
        },
        onStateChange: e=>{
          clearTimeout(clipShowT);
          if(e.data === 1 && box.classList.contains("playing")){
            clipShowT = setTimeout(()=>{ if(box.classList.contains("playing")) box.classList.add("clip-on"); }, 4000);
          } else if(e.data === 2 || e.data === 0) box.classList.remove("clip-on");
        }
      }
    });
  });
}

renderStatus(); refreshDoors(); setBg(homeBg());
(function(){ const t = todayNum(); if(!t || PREVIEW || seen.has(t)) return;
  const b = grid.querySelector(`.door[data-n="${t}"]`);
  if(b) setTimeout(()=>b.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}), 700); })();
setInterval(()=>{ renderStatus(); refreshDoors(); if(!bgPicked) setBg(homeBg()); }, 60000);
addEventListener("hashchange", ()=>location.reload());
</script>
