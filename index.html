<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adventskalender für dich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: ein Foto füllt den ganzen Bildschirm, darüber 24 Türchen aus Milchglas. Das Foto wechselt mit dem Tag und mit dem geöffneten Song. */
:root{
  --ink:#fbf7f2;
  --muted:rgba(251,247,242,.72);
  --glass:rgba(255,255,255,.10);
  --glass-strong:rgba(20,16,22,.58);
  --edge:rgba(255,255,255,.28);
  --accent:#f3c98b;
  --shade:rgba(8,6,12,.55);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#141019}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;background:#141019;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}

/* Hintergrundfoto mit Überblendung */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#33405e 0%,#1b1a2c 55%,#0f0c14 100%)}
.bg .layer{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.04)}
.bg .layer.on{opacity:1;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.1) translate(-1%,-1%)}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,12,.35) 0%,rgba(8,6,12,.15) 35%,rgba(8,6,12,.6) 100%)}

.snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(24px,4vw,40px);padding-top:clamp(36px,7vw,72px)}
.lights{display:none}

header{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.eyebrow{font-family:var(--f-body);font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:300;font-style:italic;font-size:clamp(2.6rem,7.5vw,5rem);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .star{display:none}
.status{font-size:.95rem;color:var(--muted);margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 14px;color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.board{background:none;border:0;box-shadow:none;padding:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-flow:dense;grid-auto-rows:1fr;gap:clamp(8px,1.4vw,14px)}
@media (max-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.grid .door.big{grid-column:auto;aspect-ratio:1/1.15}}
@media (max-width:380px){.grid{grid-template-columns:repeat(3,1fr)}}

.door{position:relative;aspect-ratio:1/1.15;max-width:100%;perspective:900px;border:0;padding:0;background:transparent;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.door.big{grid-column:span 2;aspect-ratio:auto}
.door > *{pointer-events:none}
.door:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:14px}
.inside{position:absolute;inset:0;border-radius:12px;background:#0d0b10 center/cover no-repeat;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 6px 20px rgba(0,0,0,.6)}
.inside span{display:none}
.leaf{position:absolute;inset:0;border-radius:12px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  transform-origin:left center;transition:transform .9s cubic-bezier(.2,.9,.25,1),background .3s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.leaf::after{content:"";position:absolute;right:9px;top:50%;width:4px;height:14px;margin-top:-7px;border-radius:2px;background:rgba(255,255,255,.45)}
.door:hover .leaf{background:rgba(255,255,255,.16)}
.num{font-family:var(--f-display);font-weight:300;font-size:clamp(1.6rem,4.2vw,2.6rem);line-height:1;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.doodle{display:none}
.door.locked .num{opacity:.78}
.door.open .leaf,.door.opened .leaf{transform:rotateY(-108deg);background:rgba(255,255,255,.2)}
.door.today .leaf{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 28px rgba(243,201,139,.35)}
.door.today .num{color:var(--accent)}
.door.shake .leaf{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

footer{text-align:center;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:1.1rem;color:var(--muted);text-shadow:0 2px 16px rgba(0,0,0,.5)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--glass-strong);border:1px solid var(--edge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Karte */
.scrim{position:fixed;inset:0;background:rgba(8,6,12,.35);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--glass-strong);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--edge);
  border-radius:22px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:clamp(18px,4vw,28px);box-shadow:0 30px 80px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:16px;animation:pop .5s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card .date{font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.card h2{font-family:var(--f-display);font-weight:300;font-style:italic;font-size:2.2rem;line-height:1.1;margin:4px 0 0}
.close{border:1px solid var(--edge);background:var(--glass);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.close:focus-visible,.watch:focus-visible,.save:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:1.3rem;line-height:1.45;margin:0}
#card-media{display:flex;flex-direction:column;gap:12px}
.video{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:14px;overflow:hidden;background:#000;border:0}
.video iframe{width:100%;height:100%;border:0;display:block}
.watch{display:flex;align-items:center;justify-content:center;gap:12px;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:14px;background:rgba(0,0,0,.35);color:var(--ink);text-decoration:none;font-size:1.05rem}
.watch .play{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#141019;display:grid;place-items:center;font-size:1.3rem}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;text-decoration:none;color:var(--ink);background:var(--glass);border:1px solid var(--edge)}
.choice .ico{width:40px;height:40px;flex:none;border-radius:50%;background:var(--ink);color:#141019;display:grid;place-items:center}
.choice b{display:block;font-weight:600}
.choice small{display:block;color:var(--muted);font-size:.85rem}

.song{display:flex;flex-direction:column;gap:12px}
.song-head{display:flex;align-items:center;gap:12px}
.song-head .ico{display:none}
.song-head b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.25rem}
.song-head small{display:block;color:var(--muted);font-size:.85rem}
.song audio{width:100%;max-width:100%;border-radius:999px}
.save{align-self:flex-start;text-decoration:none;background:var(--ink);color:#141019;font-weight:600;font-size:.95rem;padding:10px 18px;border-radius:999px}
.guide{border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:10px 14px;font-size:.92rem}
.guide summary{cursor:pointer;font-weight:600}
.guide summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .once{color:var(--muted)}

.vinyl-wrap{display:grid;place-items:center;padding:4px 0}
.vinyl{width:min(190px,56vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#151215 0 2px,#221d21 2px 4px);box-shadow:0 14px 34px rgba(0,0,0,.5);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(255,255,255,.10) 55deg,transparent 70deg 220deg,rgba(255,255,255,.07) 235deg,transparent 250deg)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;background:var(--accent) center/cover;display:grid;place-items:center;color:#141019;font-family:var(--f-display);font-size:clamp(1rem,4vw,1.5rem)}
.vinyl .label::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:#141019}
.vinyl .label span{transform:translateY(-55%)}
.song.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}

.clip{position:relative;overflow:hidden;isolation:isolate}
.clip iframe{position:absolute;inset:0;pointer-events:none;transform:scale(1.42);opacity:0;transition:opacity .3s}
.song.clip-on .clip iframe{opacity:1;transition:opacity 1.2s}
.clip::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px 10px rgba(0,0,0,.45);border-radius:inherit;z-index:2}
.clip .cover{position:absolute;inset:0;z-index:1;background:#0d0b10;opacity:1;transition:opacity .3s}
.song.clip-on .clip .cover{opacity:0;transition:opacity 1.2s}
.clip .cover .vinyl{width:auto;height:78%;animation-play-state:running}
.soon{aspect-ratio:16/9;width:100%;border-radius:14px;border:1px dashed var(--edge);display:grid;place-items:center;text-align:center;padding:16px;font-family:var(--f-display);font-style:italic;font-size:1.3rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .bg .layer.on{animation:none}
  .leaf,.bg .layer{transition:none}
  .card{animation:none}
  .snow{display:none}
  .vinyl{animation:none}
}
</style>
</head>
<body>


<div class="bg" id="bg" aria-hidden="true"><div class="layer"></div><div class="layer"></div></div>
<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="lights" aria-hidden="true">
    <svg viewBox="0 0 1000 56" preserveAspectRatio="none"><path d="M0 8 Q125 44 250 14 T500 14 T750 14 T1000 8" fill="none" stroke="var(--pine)" stroke-width="2.5"/></svg>
    <div class="bulbs" id="bulbs"></div>
  </div>

  <header>
    <div class="eyebrow">Für meine Lieblingsschwester</div>
    <h1>Dein Adventskalender <span class="star">✦</span></h1>
    <p class="status" id="status"></p>
  </header>

  <main class="board">
    <div class="grid" id="grid"></div>
  </main>

  <footer>Jeden Tag ein Türchen. Nicht schummeln.</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="card-head">
      <div>
        <div class="date" id="card-date"></div>
        <h2 id="card-title"></h2>
      </div>
      <button class="close" id="close" aria-label="Schließen">✕</button>
    </div>
    <div id="card-media"></div>
    <p class="note" id="card-note"></p>
  </div>
</div>

<script>
/* ===== Hier die Inhalte eintragen =====
   video: ein YouTube Link (egal welches Format, z.B. https://youtu.be/abc123 oder https://www.youtube.com/watch?v=abc123)
   spotify: optional ein Spotify Link zum selben Song, z.B. https://open.spotify.com/track/...
   clip:  optional ein YouTube Link, der stumm und in Schleife zum Song läuft (statt der Schallplatte)
   bild:  Foto für diesen Tag (siehe oben)
   titel: Name des Songs, wird in der Karte angezeigt
   song:  Name der MP3 im Ordner songs, ohne .mp3 (z.B. "t01-k7f3" für songs/t01-k7f3.mp3)
   text:  eine kleine Nachricht für den Tag (darf leer bleiben)
   Beispiel: 1: { video: "https://youtu.be/abc123", song: "t01-k7f3", text: "Hab einen schönen Tag!" }, */
const JAHR = 2026;
/* bild: ein Foto pro Tag im Ordner bilder, z.B. "bilder/01.jpg". Es wird zum Hintergrund, wenn das Türchen offen ist.
   START_BILD ist der Hintergrund vor dem 1. Dezember. */
const START_BILD = "";
const TUERCHEN = {
  1:  { video: "", song: "t01-3b94657d", titel: "Lily's Theme", clip: "https://youtu.be/BWp-MmUmhbA", text: "" },
  2:  { video: "", song: "t02-3147c97f", titel: "Those Eyes", clip: "https://youtu.be/memUamSICTc", text: "" },
  3:  { video: "", song: "t03-861fdead", titel: "Hobbit", clip: "https://youtu.be/chxX9uucndY", text: "" },
  4:  { video: "", song: "t04-42593136", titel: "Creep", text: "" },
  5:  { video: "", text: "" },
  6:  { video: "", text: "" },
  7:  { video: "", text: "" },
  8:  { video: "", text: "" },
  9:  { video: "", text: "" },
  10: { video: "", text: "" },
  11: { video: "", text: "" },
  12: { video: "", text: "" },
  13: { video: "", text: "" },
  14: { video: "", text: "" },
  15: { video: "", text: "" },
  16: { video: "", text: "" },
  17: { video: "", text: "" },
  18: { video: "", text: "" },
  19: { video: "", text: "" },
  20: { video: "", text: "" },
  21: { video: "", text: "" },
  22: { video: "", text: "" },
  23: { video: "", text: "" },
  24: { video: "", text: "" },
};

/* ===== ab hier nichts ändern ===== */
const ORDER = [7,15,2,20,11,24,4,18,9,13,1,22,16,6,19,3,12,23,8,14,21,5,17,10];
const BIG = new Set([24,6,12,1,18,9]);
const DOODLES = ["❄","✿","☆","♡","☾","✦"];
const COLORS = ["var(--door-a)","var(--door-b)","var(--door-c)","var(--door-d)"];
const PREVIEW = location.hash === "#vorschau";

function berlinNow(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=+x.value,o),{});
  return p;
}
function isOpenable(n){
  if (PREVIEW) return true;
  const t = berlinNow();
  if (t.year > JAHR) return true;
  return t.year === JAHR && t.month === 12 && t.day >= n;
}
function todayNum(){
  const t = berlinNow();
  return (t.year === JAHR && t.month === 12 && t.day <= 24) ? t.day : 0;
}
function daysUntil(n){
  const t = berlinNow();
  const now = Date.UTC(t.year,t.month-1,t.day);
  const target = Date.UTC(JAHR,11,n);
  return Math.round((target-now)/864e5);
}

let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("advent-seen")||"[]")); } catch(e){}
function markSeen(n){ seen.add(n); try{ localStorage.setItem("advent-seen",JSON.stringify([...seen])); }catch(e){} }

function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ytId(url){
  if(!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : "");
}
const CAN_EMBED = !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) && location.protocol !== "file:" ? true : false;

/* Hintergrund */
const bgLayers = [...document.querySelectorAll("#bg .layer")];
let bgIdx = 0, bgCurrent = null;
function setBg(url){
  if(url === bgCurrent) return;
  bgCurrent = url;
  const next = bgLayers[1 - bgIdx], cur = bgLayers[bgIdx];
  if(!url){ cur.classList.remove("on"); return; }
  const img = new Image();
  img.onload = ()=>{ if(bgCurrent !== url) return; next.style.backgroundImage = `url("${url}")`; next.classList.add("on"); cur.classList.remove("on"); bgIdx = 1 - bgIdx; };
  img.src = url;
}
function homeBg(){
  const t = todayNum();
  if(t && !PREVIEW){
    for(let d = t; d >= 1; d--){ const bi = (TUERCHEN[d] || {}).bild; if(bi) return bi; }
  }
  return START_BILD;
}

/* Status */
function renderStatus(){
  const s = document.getElementById("status");
  const t = berlinNow();
  if (PREVIEW){ s.innerHTML = '<span class="pill">Vorschau: alle Türchen offen</span>'; return; }
  if (t.year < JAHR || (t.year === JAHR && t.month < 12)){
    const d = daysUntil(1);
    s.innerHTML = d === 1 ? '<span class="pill">Morgen geht es los!</span>' : `Noch <span class="pill">${d} Mal schlafen</span> bis zum ersten Türchen`;
  } else if (todayNum()){
    const n = todayNum();
    s.innerHTML = n === 24 ? '<span class="pill">Frohe Weihnachten! ♡</span>' : `Heute ist <span class="pill">Türchen ${n}</span> dran`;
  } else {
    s.innerHTML = '<span class="pill">Alle Türchen sind offen ♡</span>';
  }
}

/* Türchen */
const grid = document.getElementById("grid");
ORDER.forEach((n,i)=>{
  const b = document.createElement("button");
  b.className = "door" + (BIG.has(n) ? " big" : "");
  b.dataset.n = n;
  b.style.setProperty("--dc", COLORS[(i*3+n)%4]);
  b.innerHTML = `<div class="inside"><span>${["🎄","☕","🍪","🧦","🎁","⭐","🕯️","🦌"][n%8]}</span></div>
    <div class="leaf"><span class="num">${n}</span><span class="doodle">${DOODLES[n%6]}</span></div>`;
  const bi = (TUERCHEN[n] || {}).bild;
  if(bi) b.querySelector(".inside").style.backgroundImage = `url("${bi}")`;
  grid.appendChild(b);
});
function refreshDoors(){
  const today = todayNum();
  grid.querySelectorAll(".door").forEach(b=>{
    const n = +b.dataset.n, ok = isOpenable(n);
    b.classList.toggle("locked", !ok);
    b.classList.toggle("opened", ok && seen.has(n));
    b.classList.toggle("today", !PREVIEW && n === today && !seen.has(n));
    b.setAttribute("aria-label", ok ? `Türchen ${n} öffnen` : `Türchen ${n}, noch geschlossen`);
  });
}

let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"),2600);
}

grid.addEventListener("click", e=>{
  const b = e.target.closest(".door"); if(!b) return;
  const n = +b.dataset.n;
  if(!isOpenable(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const d = daysUntil(n);
    toast(d === 1 ? `Türchen ${n} darfst du morgen öffnen ♡` : `Geduld! Noch ${d} Mal schlafen bis Türchen ${n}`);
    return;
  }
  b.classList.add("open");
  markSeen(n);
  setTimeout(()=>{ showCard(n); refreshDoors(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550);
});

/* Karte */
const scrim = document.getElementById("scrim");
let lastDoor = null;
function showCard(n){
  lastDoor = grid.querySelector(`.door[data-n="${n}"]`);
  const item = TUERCHEN[n] || {};
  document.getElementById("card-date").textContent = `${n}. Dezember`;
  document.getElementById("card-title").textContent = `Türchen ${n}`;
  const media = document.getElementById("card-media");
  const id = ytId(item.video);
  const sp = (item.spotify || "").trim();
  const song = (item.song || "").replace(/[^A-Za-z0-9_-]/g,"");
  const clipId = CAN_EMBED ? ytId(item.clip) : "";
  if(!id && !sp && !song){
    media.innerHTML = '<div class="soon">Hier versteckt sich bald eine Überraschung ✿</div>';
  } else {
    let html = "";
    if(id && CAN_EMBED){
      html += `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Video zu Türchen ${n}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    } else if(id){
      html += `<a class="watch" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="play">▶</span>Video ansehen</a>`;
    }
    if(sp){
      html += `<div class="choices"><a class="choice spotify" href="${sp.replace(/"/g,'')}" target="_blank" rel="noopener"><span class="ico">♫</span><span><b>Auf Spotify anhören</b><small>perfekt für die Fahrt zur Arbeit</small></span></a></div>`;
    }
    if(song){
      html += `<div class="song">
        <div class="song-head"><span class="ico">♫</span><span><b>${item.titel ? esc(item.titel) : "Der Song von heute"}</b><small>gespielt von Arne</small></span></div>
        ${clipId ? `<div class="video clip"><div class="yt" data-clip="${clipId}"></div><div class="vinyl-wrap cover" aria-hidden="true"><div class="vinyl"><div class="label"><span>${n}</span></div></div></div></div>` : ""}
        ${!id && !clipId ? `<div class="vinyl-wrap"><div class="vinyl" aria-hidden="true"><div class="label"><span>${n}</span></div></div></div>` : ""}
        <audio controls preload="none" src="songs/${song}.mp3"></audio>
        <a class="save" href="songs/${song}.mp3" download="${item.titel ? esc(item.titel) : "Tuerchen " + n}.mp3">↓ Song speichern</a>
        <details class="guide"><summary>So landet der Song in deinem Spotify</summary><ol>
          <li class="once">Nur beim ersten Mal: In Spotify auf dein Profilbild tippen, dann Einstellungen und Datenschutz › Apps und Geräte › „Lokale Audiodateien“ einschalten.</li>
          <li>Hier auf „Song speichern“ tippen und mit „Laden“ bestätigen.</li>
          <li>Die App Dateien öffnen und im Ordner Downloads den Song gedrückt halten › Bewegen.</li>
          <li>„Auf meinem iPhone“ › Ordner „Spotify“ wählen und auf Bewegen tippen.</li>
          <li>In Spotify unter Bibliothek › Lokale Dateien ist er jetzt da und läuft auch ohne Internet. ♫</li>
        </ol></details>
      </div>`;
    }
    media.innerHTML = html;
    const yt = media.querySelector(".yt");
    if(yt) initClip(yt);
  }
  const note = document.getElementById("card-note");
  note.textContent = item.text || "";
  note.hidden = !item.text;
  if(item.bild) setBg(item.bild);
  scrim.hidden = false;
  document.getElementById("close").focus();
}
function closeCard(){
  scrim.hidden = true;
  setBg(homeBg());
  try{ if(clipPlayer) clipPlayer.destroy(); }catch(e){}
  clipPlayer = null; clipReady = false;
  document.getElementById("card-media").innerHTML = "";
  if(lastDoor){ lastDoor.classList.remove("open"); lastDoor.focus(); }
}
document.getElementById("close").addEventListener("click", closeCard);
const cm = document.getElementById("card-media");
["play","pause","ended"].forEach(ev=>cm.addEventListener(ev, e=>{
  const box = e.target.closest && e.target.closest(".song");
  if(!box) return;
  box.classList.toggle("playing", ev === "play");
  if(ev !== "play") box.classList.remove("clip-on");
  if(clipPlayer && clipReady){
    try{ if(ev === "play"){ clipPlayer.mute(); clipPlayer.playVideo(); } else clipPlayer.pauseVideo(); }catch(err){}
  }
}, true));
scrim.addEventListener("click", e=>{ if(e.target === scrim) closeCard(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && !scrim.hidden) closeCard(); });

/* Clip (YouTube Player, stumm im Hintergrund) */
let clipPlayer = null, clipReady = false, ytApi = null, clipShowT = null;
/* kurz vor Ende zurückspringen, damit YouTube kein Endbild und keinen Titel zeigt */
setInterval(()=>{
  try{
    if(!clipPlayer || !clipReady || clipPlayer.getPlayerState() !== 1) return;
    const d = clipPlayer.getDuration(), t = clipPlayer.getCurrentTime();
    if(d > 2 && d - t < 1.2) clipPlayer.seekTo(0, true);
  }catch(e){}
}, 250);
function loadYtApi(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res=>{
    if(window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prev) prev(); res(window.YT); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function initClip(el){
  const vid = el.dataset.clip, box = el.closest(".song");
  clipPlayer = null; clipReady = false;
  loadYtApi().then(YT=>{
    if(!document.body.contains(el)) return;
    clipPlayer = new YT.Player(el, {
      host: "https://www.youtube-nocookie.com",
      videoId: vid,
      playerVars: { mute:1, controls:0, loop:1, playlist:vid, playsinline:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, modestbranding:1 },
      events: {
        onReady: e=>{
          clipReady = true; e.target.mute();
          if(box.classList.contains("playing")) e.target.playVideo();
        },
        onStateChange: e=>{
          clearTimeout(clipShowT);
          if(e.data === 1 && box.classList.contains("playing")){
            clipShowT = setTimeout(()=>{ if(box.classList.contains("playing")) box.classList.add("clip-on"); }, 4000);
          } else if(e.data === 2 || e.data === 0) box.classList.remove("clip-on");
        }
      }
    });
  });
}

/* Lichterkette */
const bulbs = document.getElementById("bulbs");
const bc = ["var(--berry)","var(--honey)","var(--pine)","#f6a6b2","var(--honey)"];
for(let i=0;i<14;i++){
  const s = document.createElement("span"); s.className = "bulb";
  const x = (i+0.5)/14;
  s.style.setProperty("--y", (14 + 16*Math.abs(Math.sin(x*Math.PI*4))) + "px");
  s.style.setProperty("--c", bc[i%bc.length]);
  s.style.setProperty("--d", (i*0.37%2.6) + "s");
  bulbs.appendChild(s);
}

/* Schnee */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  let w,h,flakes=[];
  function size(){ w=c.width=innerWidth; h=c.height=innerHeight; }
  size(); addEventListener("resize", size);
  for(let i=0;i<60;i++) flakes.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.6,s:.3+Math.random()*.8,o:Math.random()*6});
  function tick(t){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .5;
    for(const f of flakes){
      f.y += f.s; f.x += Math.sin(t/1400 + f.o)*.3;
      if(f.y > h+5){ f.y = -5; f.x = Math.random()*w; }
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

renderStatus(); refreshDoors(); setBg(homeBg());
setInterval(()=>{ renderStatus(); refreshDoors(); }, 60000);
addEventListener("hashchange", ()=>location.reload());
