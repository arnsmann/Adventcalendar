<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adventskalender">
<meta name="theme-color" content="#2b211d">
<title>Adventskalender für dich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Fredoka:wght@400;500;600&family=Gochi+Hand&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: Foto des Tages als Vollbild Hintergrund. Mittig eine nahe Ansicht der Treppe zu Hause (ein Bildschirm), die Tüten hängen am Edelstahlgeländer. */
:root{
  --ink:#4a3128; --soft:#8a6a5d; --board:#fff8f1; --berry:#c9566b; --pine:#3f6f57; --honey:#d9a441;
  --door-a:#f0c9c0; --door-b:#cfe0d2; --door-c:#f5ddb0; --door-d:#e7d3ea; --door-edge:rgba(90,58,49,.18); --inside:#3b2a24;
  --shadow:0 18px 50px rgba(20,10,5,.35);
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#2b211d}
[hidden]{display:none!important}
body{background:#2b211d;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden}

/* Fotohintergrund */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#5b4a42,#2b211d)}
.bg .layer,.view .layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}
.bg .layer.on,.view .layer.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:rgba(20,12,8,.25)}

.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:16px 20px}
header{background:var(--board);border-radius:20px;padding:10px 22px 12px;box-shadow:var(--shadow);text-align:center;max-width:100%}
.eyebrow{font-family:var(--f-hand);font-size:1.15rem;color:var(--berry);line-height:1.1}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance}
.status{font-family:var(--f-display);font-size:.95rem;color:var(--soft);margin:4px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:#fff;border:2px dashed var(--door-edge);border-radius:999px;padding:1px 12px;color:var(--ink)}

/* Szene */
.scene{position:relative;width:min(100%,calc((100vh - 150px) * 1195 / 896),1500px);aspect-ratio:1195/896;
  border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#f1ece6}
.stage{position:absolute;inset:0;container-type:inline-size}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.view{position:absolute;overflow:hidden;background:linear-gradient(#a9bfd4,#e6dccb)}
#grid{position:absolute;inset:0}

/* Licht, Farbe und Textur über der Szene */
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shade{mix-blend-mode:multiply;z-index:5}
.tint{z-index:6;mix-blend-mode:soft-light;opacity:.5}
.tint rect{fill:var(--tint,#c9b28f);transition:fill 1.6s}
.glow{mix-blend-mode:screen;z-index:7}
.grain{mix-blend-mode:overlay;z-index:8}
#grid{z-index:4}

/* gemaltes Treppenhaus */
.flur{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;pointer-events:none;user-select:none;-webkit-user-select:none}
.stage .view{z-index:1}
.door{filter:none!important;animation:none!important;transform:none!important;background:none;border-radius:.5cqw}
.door::after{content:"";position:absolute;inset:-12% -14%;border-radius:1cqw;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 0 0 .18cqw rgba(255,240,205,.95),0 0 1.6cqw .4cqw rgba(255,210,130,.75)}
.door:hover::after,.door:focus-visible::after{opacity:1}
.door:focus-visible{outline:none}
.door.today::after{opacity:1;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .25cqw rgba(255,226,150,1),0 0 2.6cqw .9cqw rgba(255,200,110,.9)}}
.door.shake::after{opacity:1;animation:flash .5s ease}
@keyframes flash{30%{box-shadow:0 0 0 .25cqw rgba(255,255,255,1),0 0 2cqw .6cqw rgba(255,255,255,.8)}}
.door.open::after{opacity:1}
@media (prefers-reduced-motion:reduce){.door.today::after{animation:none}}

/* Papiertüten */
.door{position:absolute;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 0.38cqw 0.38cqw rgba(60,30,10,.35));transform-origin:50% 0}
.door > *{pointer-events:none}
.door:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:4px}
.bag{position:absolute;inset:0;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.bag::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.08) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22))}
.s0 .bag{background:repeating-linear-gradient(90deg,#b4502f 0 0.67cqw,#f1e4d1 0.67cqw 1.34cqw)}
.s1 .bag{background:repeating-linear-gradient(90deg,#211c1a 0 0.61cqw,#eedfc8 0.61cqw 1.22cqw)}
.s2 .bag{background:repeating-linear-gradient(90deg,#1f7a52 0 0.77cqw,#155a3c 0.77cqw 1.02cqw,#1f7a52 1.02cqw 1.66cqw,#2b8c61 1.66cqw 1.79cqw)}
.fold{position:absolute;left:9%;right:9%;top:0;height:13%;background:rgba(0,0,0,.2);box-shadow:inset 0 -1px 0 rgba(255,255,255,.15)}
.sticker{position:absolute;left:50%;top:54%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#16120f;color:#fff;
  display:grid;place-items:center;font-family:var(--f-hand);font-size:1.98cqw;line-height:1}
.bclip{position:absolute;left:50%;top:-10%;width:34%;height:18%;transform:translateX(-50%);transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.bclip::before{content:"";position:absolute;left:12%;right:12%;top:0;height:62%;border:0.19cqw solid #c99a34;border-bottom:0;border-radius:0.51cqw 0.51cqw 0 0}
.bclip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;border-radius:0.13cqw;background:linear-gradient(180deg,#f3d27a,#c99a34 60%,#a67c22)}
.door.open .bclip,.door.opened .bclip{transform:translate(-50%,-160%) rotate(-28deg);opacity:0}
.door.opened .fold{background:#2b1f1a;height:9%;top:-1%;box-shadow:inset 0 3px 5px rgba(0,0,0,.5)}
.door.open{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-6%) rotate(-3deg)}}
.door.hang{animation:sway 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.door.today{animation:bob 2.4s ease-in-out infinite}
.door.today .sticker{box-shadow:0 0 0 0.32cqw #f3d27a,0 0 1.28cqw rgba(243,210,122,.95)}
@keyframes bob{50%{transform:translateY(-5%)}}
.door.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

@media (max-width:520px){header{padding:8px 16px 10px}.eyebrow{font-size:1rem}h1{font-size:1.55rem}.status{font-size:.85rem}}
footer{font-family:var(--f-hand);font-size:1.1rem;color:#fff8f1;text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--board);font-family:var(--f-display);padding:12px 20px;border-radius:999px;transition:.3s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Karte */
.scrim{position:fixed;inset:0;background:rgba(40,20,18,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--board);border-radius:26px;max-width:640px;transition:max-width .7s cubic-bezier(.3,1,.4,1),padding .5s;width:100%;max-height:100%;overflow:auto;padding:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;border:3px solid var(--door-edge);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.scrim{transition:background .6s}
.scrim.cinema{background:rgba(15,8,6,.82)}
.card.cinema{max-width:min(1180px,96vw,calc((100vh - 330px) * 16 / 9 + 40px));padding:16px}
.card.cinema .clip::after{box-shadow:inset 0 0 30px 6px rgba(0,0,0,.4)}
@media (max-width:600px){.card.cinema{padding:12px}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:1.8rem;margin:0}
.card .date{font-family:var(--f-hand);font-size:1.25rem;color:var(--berry)}
.close{border:0;background:var(--door-a);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.close:focus-visible,.watch:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.note{font-family:var(--f-hand);font-size:1.45rem;line-height:1.35;margin:0;color:var(--ink)}
.video{aspect-ratio:16/9;max-width:100%;width:100%;border-radius:18px;overflow:hidden;background:var(--inside);border:0}
.video iframe{width:100%;height:100%;border:0;display:block}
.clip{position:relative;overflow:hidden;isolation:isolate}
.clip iframe{position:absolute;inset:0;pointer-events:none;transform:scale(1.42);opacity:0;transition:opacity .3s}
.song.clip-on .clip iframe{opacity:1;transition:opacity 1.2s}
.clip::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px 18px rgba(30,20,19,.55);border-radius:inherit;z-index:2}
.clip .cover{position:absolute;inset:0;z-index:1;background:var(--inside);opacity:1;transition:opacity .3s}
.song.clip-on .clip .cover{opacity:0;transition:opacity 1.2s}
.clip .cover .vinyl{width:auto;height:78%;animation-play-state:running}
.watch{display:flex;align-items:center;justify-content:center;gap:12px;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:18px;
  background:linear-gradient(135deg,var(--door-a),var(--door-d));color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.watch .play{width:64px;height:64px;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#card-media{display:flex;flex-direction:column;gap:12px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;text-decoration:none;color:var(--ink);
  background:var(--door-b);border:2px solid var(--door-edge);font-family:var(--f-body)}
.choice:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.choice .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.choice b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.choice small{display:block;color:var(--soft);font-size:.85rem}
.vinyl-wrap{display:grid;place-items:center;padding:8px 0 4px}
.vinyl{width:min(200px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#2b201e 0 2px,#3a2c29 2px 4px);box-shadow:0 10px 24px rgba(0,0,0,.28);
  animation:spin 3.2s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(255,255,255,.10) 55deg,transparent 70deg 220deg,rgba(255,255,255,.07) 235deg,transparent 250deg)}
.vinyl .label{position:absolute;inset:33%;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff;
  font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,4vw,1.5rem)}
.vinyl .label::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:var(--board)}
.vinyl .label span{transform:translateY(-55%)}
.song.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.song{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--door-c);border:2px solid var(--door-edge)}
.song-head{display:flex;align-items:center;gap:12px}
.song-head .ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.song-head b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.song-head small{display:block;color:var(--soft);font-size:.85rem}
.song audio{width:100%;max-width:100%}
.save{align-self:flex-start;text-decoration:none;background:var(--ink);color:var(--board);font-family:var(--f-display);font-size:1rem;font-weight:500;padding:10px 18px;border-radius:999px}
.save:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.guide{border-radius:14px;background:var(--board);padding:10px 14px;font-size:.95rem}
.guide summary{cursor:pointer;font-family:var(--f-display);font-weight:500}
.guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide .once{color:var(--soft)}
.soon{aspect-ratio:16/9;width:100%;border-radius:18px;border:3px dashed var(--door-edge);display:grid;place-items:center;text-align:center;padding:16px;
  font-family:var(--f-hand);font-size:1.4rem;color:var(--soft)}

/* Karte im Look des Tagesbilds */
.card.has-pic{background:linear-gradient(rgba(25,15,12,.6),rgba(25,15,12,.82)),var(--pic) center/cover;border-color:rgba(255,255,255,.18);color:#fff8f1}
.card.has-pic h2,.card.has-pic .note,.card.has-pic .song-head b{color:#fff8f1}
.card.has-pic .date{color:#f6c3cc}
.card.has-pic .song{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card.has-pic .song-head small{color:rgba(255,248,241,.75)}
.card.has-pic .save{background:#fff8f1;color:var(--ink)}
.card.has-pic .guide{background:rgba(255,248,241,.94);color:var(--ink)}
.card.has-pic .vinyl-wrap:not(.cover){aspect-ratio:16/9;max-width:100%;border-radius:14px;padding:0;background:var(--pic) center/cover;box-shadow:inset 0 0 40px 10px rgba(0,0,0,.35)}
.card.has-pic .vinyl-wrap .vinyl{width:auto;height:70%;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.card.has-pic .clip .cover{background:var(--pic) center/cover}
.card.has-pic .vinyl .label{background:center/cover var(--pic)}
.card.has-pic .vinyl .label span{text-shadow:0 1px 6px rgba(0,0,0,.7)}

/* Großbild: fast Vollbild für Clip oder Schallplatte */
.song-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big-btn{border:2px solid var(--door-edge);background:transparent;color:inherit;font-family:var(--f-display);font-size:1rem;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer}
.card.has-pic .big-btn{border-color:rgba(255,248,241,.45);color:#fff8f1}
.big-btn:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.scrim.theater{background:rgba(8,4,3,.94);padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.card.theater{max-width:none;width:100%;height:100%;max-height:none;padding:12px 14px;gap:10px;border-radius:18px;overflow:hidden}
.card.theater .card-head{flex:none}
.card.theater h2{font-size:1.3rem}
.card.theater .note,.card.theater .guide,.card.theater .song-head small{display:none}
.card.theater #card-media{flex:1;min-height:0}
.card.theater .song{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px}
.card.theater .song-head{flex:none}
.card.theater .clip,.card.theater .song > .vinyl-wrap{flex:1;min-height:0;width:100%;aspect-ratio:auto;align-self:center}
.card.theater .clip iframe{inset:50% auto auto 50%;width:max(100%,calc((100vh - 200px) * 16 / 9));height:max(100%,calc(100vw * 9 / 16));transform:translate(-50%,-50%) scale(1.42)}
.card.theater audio,.card.theater .song-actions{flex:none}

/* Großbild auf dem Handy im Hochformat: Inhalt quer drehen, Handy einfach drehen */
@media (orientation:portrait) and (max-width:820px){
  .scrim.theater{padding:0;place-items:center;overflow:hidden}
  .card.theater{position:fixed;left:50%;top:50%;width:calc(100dvh - 20px);height:calc(100vw - 20px);max-height:none;
    transform:translate(-50%,-50%) rotate(90deg);animation:none;border-radius:16px;padding:10px 12px;gap:8px}
  .card.theater .card-head{display:none}
  .card.theater .song{padding:8px;gap:8px}
  .card.theater .song-head{display:none}
  .card.theater .clip iframe{inset:0;width:100%;height:100%;transform:scale(1.42)}
  .card.theater .song-bar{display:flex}
}
.song-bar{display:none}

/* kleines Albumcover statt Notensymbol */
.song-head .cover-art{width:46px;height:46px;flex:none;border-radius:8px;font-size:0;
  background:repeating-radial-gradient(circle at 50% 50%,#1c1513 0 1.5px,#2c221f 1.5px 3px);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12);position:relative}
.song-head .cover-art::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--berry);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.card.has-pic .song-head .cover-art{background:var(--pic) center/cover}
.card.has-pic .song-head .cover-art::after{display:none}

/* Schneekugel (gemalt) */
.globe-wrap{transition:margin-bottom .35s,left .6s ease;position:relative;width:calc(min(92vw,calc((100vh - 270px) * 478 / 625),600px) * var(--gk,1));min-width:260px;aspect-ratio:478/566;margin-top:4px}
.globe-img{transition:opacity .35s;position:absolute;top:0;left:0;width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;pointer-events:none;
  filter:drop-shadow(0 24px 30px rgba(30,10,5,.4));transform-origin:50% 92%}
/* echtes Treppenhaus im Glas */
.globe{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;z-index:1;overflow:hidden;transform-origin:50% 92%}
.globe .scene{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-width:none;border-radius:50%;overflow:hidden;box-shadow:none;background:#2a1d18}
.globe .stage{position:absolute;inset:auto;top:0;left:50%;height:100%;width:auto;aspect-ratio:1195/896;transform:translateX(-49.4%)}
.globe::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:9;
  background:
    radial-gradient(ellipse 30% 18% at 30% 18%,rgba(255,255,255,.42),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 8% 4% at 72% 13%,rgba(255,255,255,.35),rgba(255,255,255,0) 80%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 64%,rgba(225,235,245,.14) 82%,rgba(240,245,250,.38) 100%);
  box-shadow:inset -14px -20px 40px rgba(255,255,255,.12),inset 12px 16px 36px rgba(0,0,0,.22)}
.globe-wrap:not(.zoomed) #grid{pointer-events:none}
.globe-img{z-index:2}
/* Kreis der Kugel im Bild: Mitte 50% / 42.4%, Durchmesser 97.5% der Breite */
.globe-snow{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:3;transform-origin:50% 92%}
.globe-enter{position:absolute;left:1.26%;top:1.24%;width:97.5%;aspect-ratio:1;border-radius:50%;border:0;background:none;cursor:zoom-in;z-index:4;-webkit-tap-highlight-color:transparent}
.globe-enter:focus-visible{outline:3px solid #ffe2a8;outline-offset:4px}
.shake-btn{position:absolute;left:12%;right:12%;bottom:1%;height:22%;z-index:5;border:0;background:none;cursor:pointer;border-radius:40px;-webkit-tap-highlight-color:transparent}
.shake-btn:focus-visible{outline:3px solid #ffe2a8;outline-offset:2px}
.globe-hint{font-family:var(--f-hand);font-size:1.05rem;color:#fff8f1;text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center;max-width:46ch}
.globe-wrap.shaking .globe-img,.globe-wrap.shaking .globe-snow,.globe-wrap.shaking .globe{animation:wobble .6s ease}
@keyframes wobble{20%{transform:rotate(-3deg)}45%{transform:rotate(2.5deg)}70%{transform:rotate(-1.2deg)}}
.globe-back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:16;border:0;
  background:var(--board);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:1rem;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer}
/* hineingezoomt */
.globe-wrap.zoomed .globe{display:block;position:fixed;z-index:15;overflow:hidden;border-radius:18px;aspect-ratio:auto;width:auto;
  inset:calc(66px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  animation:dive .55s cubic-bezier(.2,.9,.3,1)}
@media (min-aspect-ratio:1/1){
  .globe-wrap.zoomed .globe{left:0;right:0;margin:0 auto;width:min(calc(100vw - 20px),calc((100vh - 80px) * 1195 / 896));bottom:auto;aspect-ratio:1195/896}
}
@keyframes dive{from{transform:scale(.55);opacity:0;border-radius:50%}}
.globe-wrap.zoomed .scene{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-width:none;box-shadow:none;border-radius:18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.globe-wrap.zoomed .scene::-webkit-scrollbar{display:none}
.globe-wrap.zoomed .stage{position:relative;inset:auto;left:auto;transform:none;margin:0 auto;height:100%;width:auto;aspect-ratio:1195/896}
.globe-wrap.zoomed .globe-snow{display:none}
.globe-wrap.zoomed .globe::after{display:none}
.globe-wrap.zoomed::before{content:"";position:fixed;inset:-50vh -50vw;background:rgba(15,8,6,.78);z-index:14}
@media (prefers-reduced-motion:reduce){.globe-wrap.zoomed .globe,.globe-wrap.shaking .globe-img,.globe-wrap.shaking .globe-snow{animation:none}}

/* Titel als gemalte Schrift direkt im Bild */

<script>
/* ===== Hier die Inhalte eintragen =====
   video: ein YouTube Link (egal welches Format, z.B. https://youtu.be/abc123 oder https://www.youtube.com/watch?v=abc123)
   spotify: optional ein Spotify Link zum selben Song, z.B. https://open.spotify.com/track/...
   clip:  optional ein YouTube Link, der stumm und in Schleife zum Song läuft (statt der Schallplatte)
   bild:  Foto für diesen Tag (siehe oben)
   bildpos: optional, welcher Teil des Bildes im Hintergrund zu sehen ist (z.B. "100% 50%" = rechter Rand, damit Personen links neben der Kugel stehen)
   wetter: was sich in der Kugel bewegt: "schnee" (Standard), "regen", "magie", "elben", "gluehwuermchen" oder "pusteblume"
   fenster: optional, was die Fenster im Treppenhaus zeigen: [Größe, Ausschnitt], z.B. ["240%", "92% 42%"] für den Wald weiter hinten
   kugelversatz: optional, schiebt die Kugel am Computer nach rechts (z.B. "12vw"), damit Personen im Bild frei stehen
   kugelrand: nur bei breiten Kugeln, wie weit das Bild links und oben über die Kugel hinausragt (Pixel bei 956 px Grundbreite)
   kugel: optional eine eigene Schneekugel für diesen Tag (z.B. Harry Potter Sockel)
   titel: Name des Songs, wird in der Karte angezeigt
   song:  Name der MP3 im Ordner songs, ohne .mp3 (z.B. "t01-k7f3" für songs/t01-k7f3.mp3)
   text:  eine kleine Nachricht für den Tag (darf leer bleiben)
   Beispiel: 1: { video: "https://youtu.be/abc123", song: "t01-k7f3", text: "Hab einen schönen Tag!" }, */
const JAHR = 2026;
/* bild: ein Foto pro Tag im Ordner bilder, z.B. "bilder/01.jpg". An diesem Dezembertag ist es der Hintergrund,
   und beim Öffnen eines älteren Türchens kommt sein Foto zurück. START_BILD ist der Hintergrund vor dem 1. Dezember. */
const START_BILD = "bilder/start-87591f46.jpg";
const TUERCHEN = {
  1:  { video: "", song: "t01-3b94657d", titel: "Lily's Theme", bild: "bilder/b01-68e822e2.jpg", wetter: "magie", kugel: "bilder/kugel-hp-f9b0b214.webp", clip: "https://youtu.be/BWp-MmUmhbA", text: "" },
  2:  { video: "", song: "t02-3147c97f", titel: "Those Eyes", bild: "bilder/b02-24e36be5.jpg", wetter: "gluehwuermchen", kugel: "bilder/kugel-mond-4b3af2f3.webp", clip: "https://youtu.be/memUamSICTc", text: "" },
  3:  { video: "", song: "t03-861fdead", titel: "Hobbit", bild: "bilder/b03-54943730.jpg", wetter: "elben", kugel: "bilder/kugel-elben-913df12a.webp", clip: "https://youtu.be/chxX9uucndY", text: "" },
  4:  { video: "", song: "t04-42593136", titel: "Creep", bild: "bilder/b04-e39107ba.jpg", wetter: "regen", kugel: "bilder/kugel-regen-b47fee09.webp", text: "" },
  5:  { video: "", song: "t05-ebefd28c", titel: "Memories", kugel: "bilder/kugel-wald-58817d5f.webp", kugelrand: [200,80], kugelversatz: "12vw", fenster: ["240%", "92% 42%"], bildpos: "100% 50%", bild: "bilder/b05-208fe068.jpg", wetter: "pusteblume", text: "" },
  6:  { video: "", text: "" },
  7:  { video: "", song: "t07-e9b8a12f", titel: "Spirit", bild: "bilder/b07-fc7e8a62.jpg", wetter: "pusteblume", kugel: "bilder/kugel-spirit-e2d0bdfd.webp", kugelrand: [60,0], kugelversatz: "-18vw", fenster: ["300%", "14% 64%"], clip: "https://youtu.be/q9ikblV9Cyg", text: "" },
  8:  { video: "", text: "" },

  10: { video: "", text: "" },

  19: { video: "", text: "" },
  20: { video: "", text: "" },
  21: { video: "", text: "" },
  22: { video: "", text: "" },
  23: { video: "", text: "" },
  24: { video: "", text: "" },
};

/* ===== ab hier nichts ändern ===== */
const ORDER = [7,15,2,20,11,24,4,18,9,13,1,22,16,6,19,3,12,23,8,14,21,5,17,10];
const BIG = new Set([24,6,12]);
const DOODLES = ["❄","✿","☆","♡","☾","✦"];
const COLORS = ["var(--door-a)","var(--door-b)","var(--door-c)","var(--door-d)"];
const PREVIEW = location.hash === "#vorschau";

function berlinNow(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=+x.value,o),{});
  return p;
}
function isOpenable(n){
  if (PREVIEW) return true;
  const t = berlinNow();
  if (t.year > JAHR) return true;
  return t.year === JAHR && t.month === 12 && t.day >= n;
}
function todayNum(){
  const t = berlinNow();
  return (t.year === JAHR && t.month === 12 && t.day <= 24) ? t.day : 0;
}
function daysUntil(n){
  const t = berlinNow();
  const now = Date.UTC(t.year,t.month-1,t.day);
  const target = Date.UTC(JAHR,11,n);
  return Math.round((target-now)/864e5);
}

let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("advent-seen")||"[]")); } catch(e){}
function markSeen(n){ seen.add(n); try{ localStorage.setItem("advent-seen",JSON.stringify([...seen])); }catch(e){} }

function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ytId(url){
  if(!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(url.trim()) ? url.trim() : "");
}
const CAN_EMBED = !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname) && location.protocol !== "file:" ? true : false;

/* Hintergrund */
const bgSets = [document.querySelector(".bg"), ...document.querySelectorAll(".view")].map(el=>[...el.querySelectorAll(".layer")]);
let bgIdx = 0, bgCurrent = null, bgPicked = false;
const GLOBE_DEFAULT = document.querySelector(".globe-img").getAttribute("src");
(function(){ const g = document.querySelector(".globe-img"), w = document.getElementById("globeWrap");
  function fit(){
    if(!g.naturalWidth) return;
    const pad = (window.globePad || [0,0]);
    g.style.width = (g.naturalWidth / 956 * 100) + "%";
    g.style.left = (-pad[0] / 956 * 100) + "%";
    g.style.top = (-pad[1] / 1132 * 100) + "%";
    // breite Kugeln auf schmalen Bildschirmen etwas kleiner machen
    w.style.setProperty("--gk", 1);
    const base = w.offsetWidth, need = base * g.naturalWidth / 956;
    let k = Math.min(1, (innerWidth - 12) / need);
    // hohe Kugeln (z.B. mit Figur obendrauf) so verkleinern, dass alles auf den Bildschirm passt
    const totalH = base * g.naturalHeight / 956;
    const normH = base * 566 / 478 + 4;
    if(totalH > normH) k = Math.min(k, normH / totalH * 1.04);
    w.style.setProperty("--gk", k);
    w.style.left = (window.globeShift && innerWidth > innerHeight && innerWidth > 820) ? window.globeShift : "";
    w.style.marginTop = pad[1] ? (pad[1] / 956 * w.offsetWidth + 4) + "px" : "";
    const extra = (g.naturalHeight - pad[1]) / 956 - 566/478;
    w.style.marginBottom = extra > 0 ? (extra * w.offsetWidth) + "px" : "";
    try{ alignViews(); }catch(e){}
  }
  window.globeFit = fit;
  g.addEventListener("load", fit); addEventListener("resize", fit); if(g.complete) fit(); })();
function setGlobe(url){
  let k = GLOBE_DEFAULT, mode = "schnee", pad = [0,0], shift = "";
  for(const d in TUERCHEN){ if(TUERCHEN[d].bild === url){ if(TUERCHEN[d].kugel) k = TUERCHEN[d].kugel; if(TUERCHEN[d].kugelrand) pad = TUERCHEN[d].kugelrand; if(TUERCHEN[d].kugelversatz) shift = TUERCHEN[d].kugelversatz; if(TUERCHEN[d].wetter) mode = TUERCHEN[d].wetter; break; } }
  window.globeMode = mode;
  window.globeShift = shift; try{ window.globeFit && window.globeFit(); }catch(e){}
  const g = document.querySelector(".globe-img");
  if(g.getAttribute("src") === k) return;
  const pre = new Image();
  pre.onload = ()=>{ g.style.opacity = 0; setTimeout(()=>{ window.globePad = pad; g.setAttribute("src", k); g.style.opacity = 1; }, 350); };
  pre.src = k;
}
function setTitleTone(img){
  try{
    const c = document.createElement("canvas"); c.width = 32; c.height = 32;
    const x = c.getContext("2d");
    // nur die obere Mitte, wo der Titel steht
    x.drawImage(img, img.naturalWidth*.25, 0, img.naturalWidth*.5, img.naturalHeight*.25, 0, 0, 32, 32);
    const d = x.getImageData(0,0,32,32).data; let L = 0;
    for(let i=0;i<d.length;i+=4) L += .2126*d[i] + .7152*d[i+1] + .0722*d[i+2];
    L /= d.length/4;
    document.documentElement.classList.toggle("dark-top", L < 110);
  }catch(e){}
}
function setTint(img){
  try{
    const c = document.createElement("canvas"); c.width = c.height = 16;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data; let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){ const l = d[i]+d[i+1]+d[i+2]; if(l < 60) continue; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
    if(!n) return;
    r/=n; g/=n; b/=n; const m = Math.max(r,g,b) || 1, k = 210 / m;   // aufhellen, Farbton behalten
    document.querySelector(".stage").style.setProperty("--tint", `rgb(${Math.min(255,r*k)|0},${Math.min(255,g*k)|0},${Math.min(255,b*k)|0})`);
  }catch(e){}
}
function setBg(url){
  if(url === bgCurrent) return;
  bgCurrent = url;
  if(!url){ bgSets.forEach(l=>l.forEach(x=>x.classList.remove("on"))); return; }
  const img = new Image();
  img.onload = ()=>{
    if(bgCurrent !== url) return;
    let pos = "";
    for(const d in TUERCHEN){ if(TUERCHEN[d].bild === url && TUERCHEN[d].bildpos){ pos = TUERCHEN[d].bildpos; break; } }
    bgSets.forEach((l,li)=>{ const next = l[1 - bgIdx], cur = l[bgIdx]; next.style.backgroundImage = `url("${url}")`; if(li === 0) next.style.backgroundPosition = (pos && innerWidth > innerHeight) ? pos : ""; next.classList.add("on"); cur.classList.remove("on"); });
    bgIdx = 1 - bgIdx;
    setTint(img); setTitleTone(img);
    setGlobe(url);
  };
  img.src = url;
}
function homeBg(){
  const t = berlinNow();
  const last = (t.year > JAHR || (t.year === JAHR && t.month === 12)) ? (t.year > JAHR ? 24 : Math.min(t.day,24)) : 0;
  for(let d = last; d >= 1; d--){ const bi = (TUERCHEN[d] || {}).bild; if(bi) return bi; }
  return START_BILD;
}

/* Status */
function renderStatus(){
  const s = document.getElementById("status");
  const t = berlinNow();
  if (PREVIEW){ s.innerHTML = '<span class="pill">Vorschau: alle Türchen offen</span>'; return; }
  if (t.year < JAHR || (t.year === JAHR && t.month < 12)){
    const d = daysUntil(1);
    s.innerHTML = d === 1 ? '<span class="pill">Morgen geht es los!</span>' : `Noch <span class="pill">${d} Mal schlafen</span> bis zum ersten Türchen`;
  } else if (todayNum()){
    const n = todayNum();
    s.innerHTML = n === 24 ? '<span class="pill">Frohe Weihnachten! ♡</span>' : `Heute ist <span class="pill">Türchen ${n}</span> dran`;
  } else {
    s.innerHTML = '<span class="pill">Alle Türchen sind offen ♡</span>';
  }
}

const HOT = {1:[465,407,490,440],5:[472,442,502,490],6:[512,435,537,485],10:[522,482,551,530],9:[465,497,492,542],11:[597,500,625,550],16:[632,530,662,580],8:[469,550,504,602],13:[547,562,577,610],14:[592,565,619,615],12:[667,590,697,642],15:[700,580,729,627],7:[522,595,560,650],18:[617,617,647,667],2:[502,637,540,700],17:[580,637,615,692],21:[437,650,474,712],19:[674,652,705,710],20:[712,657,742,707],3:[642,685,677,737],22:[517,705,552,772],24:[707,725,740,780],4:[650,747,682,812],23:[595,760,627,845]};
/* Tüten im gemalten Treppenhaus: unsichtbare Klickflächen über den gezeichneten Tüten */
const grid = document.getElementById("grid");
const IW = 1195, IH = 896;
Object.entries(HOT).forEach(([n,[x0,y0,x1,y1]])=>{
  const b = document.createElement("button");
  b.className = "door";
  b.dataset.n = n;
  b.style.cssText = `left:${x0/IW*100}%;top:${y0/IH*100}%;width:${(x1-x0)/IW*100}%;height:${(y1-y0)/IH*100}%`;
  grid.appendChild(b);
});
function refreshDoors(){
  const today = todayNum();
  grid.querySelectorAll(".door").forEach(b=>{
    const n = +b.dataset.n, ok = isOpenable(n);
    b.classList.toggle("locked", !ok);
    b.classList.toggle("opened", ok && seen.has(n));
    b.classList.toggle("today", !PREVIEW && n === today && !seen.has(n));
    b.setAttribute("aria-label", ok ? `Tüte ${n} öffnen` : `Tüte ${n}, noch zu`);
  });
}

let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"),2600);
}

grid.addEventListener("click", e=>{
  const b = e.target.closest(".door"); if(!b) return;
  const n = +b.dataset.n;
  if(!isOpenable(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const d = daysUntil(n);
    toast(d === 1 ? `Türchen ${n} darfst du morgen öffnen ♡` : `Geduld! Noch ${d} Mal schlafen bis Türchen ${n}`);
    return;
  }
  b.classList.add("open");
  markSeen(n);
  setTimeout(()=>{ showCard(n); refreshDoors(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550);
});

/* Karte */
const scrim = document.getElementById("scrim");
let lastDoor = null;
function showCard(n){

/* Clip (YouTube Player, stumm im Hintergrund) */
let clipPlayer = null, clipReady = false, ytApi = null, clipShowT = null;
/* kurz vor Ende zurückspringen, damit YouTube kein Endbild und keinen Titel zeigt */
setInterval(()=>{
  try{
    if(!clipPlayer || !clipReady || clipPlayer.getPlayerState() !== 1) return;
    const d = clipPlayer.getDuration(), t = clipPlayer.getCurrentTime();
    if(d > 2 && d - t < 1.2) clipPlayer.seekTo(0, true);
  }catch(e){}
}, 250);
function loadYtApi(){
  if(ytApi) return ytApi;
  ytApi = new Promise(res=>{
    if(window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prev) prev(); res(window.YT); };
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function initClip(el){
  const vid = el.dataset.clip, box = el.closest(".song");
  clipPlayer = null; clipReady = false;
  loadYtApi().then(YT=>{
    if(!document.body.contains(el)) return;
    clipPlayer = new YT.Player(el, {
      host: "https://www.youtube-nocookie.com",
      videoId: vid,
      playerVars: { mute:1, controls:0, loop:1, playlist:vid, playsinline:1, rel:0, iv_load_policy:3, disablekb:1, fs:0, modestbranding:1 },
      events: {
        onReady: e=>{
          clipReady = true; e.target.mute();
          if(box.classList.contains("playing")) e.target.playVideo();
        },
        onStateChange: e=>{
          clearTimeout(clipShowT);
          if(e.data === 1 && box.classList.contains("playing")){
            clipShowT = setTimeout(()=>{ if(box.classList.contains("playing")) box.classList.add("clip-on"); }, 4000);
          } else if(e.data === 2 || e.data === 0) box.classList.remove("clip-on");
        }
      }
    });
  });
}

    ctx.globalCompositeOperation = "source-over";
    for(const l of leaves){
      l.vy += (.0015 - l.vy) * .02;
      l.y += l.vy; l.x += Math.sin(t/900 + l.sw)*.0012 + (l.vx||0); if(l.vx) l.vx *= .97;
      l.rot += l.vr + Math.sin(t/700 + l.sw)*.01;
      if(l.y > .97 || l.y < -.05){ if(l.ex){ l.ex = 1; continue; } Object.assign(l, newLeaf(true)); continue; }
      if(!inside(l.x,l.y,.225)) continue;
      const X = l.x*W, Y = l.y*W, S = l.s*(W/460);
      ctx.save(); ctx.translate(X,Y); ctx.rotate(l.rot); ctx.scale(1, .55 + .45*Math.abs(Math.sin(t/500 + l.sw)));
      ctx.globalAlpha = .9*ex(l); ctx.fillStyle = l.col;
      ctx.beginPath(); ctx.moveTo(0,-S); ctx.quadraticCurveTo(S*.75,-S*.2,0,S); ctx.quadraticCurveTo(-S*.75,-S*.2,0,-S); ctx.fill();
      ctx.globalAlpha = .5; ctx.strokeStyle = "#6b3a1c"; ctx.lineWidth = Math.max(.6, S*.08);
      ctx.beginPath(); ctx.moveTo(0,-S*.9); ctx.lineTo(0,S*1.15); ctx.stroke();
      ctx.restore();
    }
  }
  function drawMagic(t){
    ctx.globalCompositeOperation = "lighter";
    for(const o of orbs){
      o.life++;
      o.vx += (Math.sin(t/1300 + o.o)*.0006 - o.vx) * .02;
      o.vy += (-(.0004 + o.r*.00012) - o.vy) * .02;
      o.x += o.vx; o.y += o.vy;
      if(o.life > o.max || o.y < .02 || !inside(o.x,o.y,.25)){ if(o.ex){ o.ex = 1; continue; } Object.assign(o, newOrb(), {y:.8 + Math.random()*.15}); continue; }
      const fade = Math.min(1, o.life/60, (o.max - o.life)/80) * ex(o);
      const tw = .6 + .4*Math.sin(t/260 + o.o*5);
      const X = o.x*W, Y = o.y*W, R = o.r*(W/460);
      const g = ctx.createRadialGradient(X,Y,0,X,Y,R*6);
      g.addColorStop(0, `hsla(${o.hue},100%,85%,${.9*fade*tw})`);
      g.addColorStop(.25, `hsla(${o.hue},95%,65%,${.35*fade*tw})`);
      g.addColorStop(1, `hsla(${o.hue},90%,55%,0)`);
      ctx.globalAlpha = 1; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(X,Y,R*6,0,6.283); ctx.fill();
      ctx.fillStyle = `hsla(${o.hue},100%,96%,${fade})`;
      ctx.beginPath(); ctx.arc(X,Y,R*.7,0,6.283); ctx.fill();
      if(tw > .97 && Math.random() < .3){       // kleines Funkeln
        ctx.strokeStyle = `hsla(${o.hue},100%,92%,${.8*fade})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(X-R*3,Y); ctx.lineTo(X+R*3,Y); ctx.moveTo(X,Y-R*3); ctx.lineTo(X,Y+R*3); ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }
  function tick(t){
    if(!W){ requestAnimationFrame(tick); return; }
    NOW = t;
    ctx.clearRect(0,0,W,W);
    const m = window.globeMode || "schnee";
    prune(flakes); prune(drops); prune(orbs); prune(motes); prune(leaves); prune(flies); prune(seeds); prune(specks);
    if(m === "regen") drawRain();
    else if(m === "magie"){ drawMagic(t); ctx.globalAlpha = .5; }
    else if(m === "elben") drawElves(t);
    else if(m === "gluehwuermchen") drawFlies(t);
    else if(m === "pusteblume") drawSeeds(t);
    else drawSnow(t);
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  if(!reduce) requestAnimationFrame(tick);
  document.getElementById("shakeBtn").addEventListener("click", shake);

  /* Handy schütteln = Kugel schütteln */
  const motionBtn = document.getElementById("motionBtn");
  const touch = matchMedia("(pointer: coarse)").matches;
  let lastShake = 0, motionOn = false;
  function onMotion(e){
    const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
    let mag;
    if(a){ mag = Math.hypot(a.x||0, a.y||0, a.z||0); }
    else { const g = e.accelerationIncludingGravity || {}; mag = Math.abs(Math.hypot(g.x||0, g.y||0, g.z||0) - 9.81); }
    const now = Date.now();
    if(mag > 13 && now - lastShake > 900 && !wrap.classList.contains("zoomed") && scrim.hidden){
      lastShake = now; shake();
      try{ navigator.vibrate && navigator.vibrate(30); }catch(err){}
    }
  }
  function startMotion(){
    if(motionOn) return; motionOn = true;
    addEventListener("devicemotion", onMotion);
    motionBtn.hidden = true;
    document.getElementById("globeHint").textContent = "Tipp auf die Kugel, um hineinzuschauen · schüttel dein Handy für Schnee";
  }
  if(touch && "DeviceMotionEvent" in window){
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if(isIOS && typeof DeviceMotionEvent.requestPermission === "function"){
      // iPhone: Apple verlangt einmal eine Erlaubnis per Knopfdruck
      let asked = false;
      try{ asked = localStorage.getItem("advent-motion") === "ja"; }catch(e){}
      if(asked){
        // Erlaubnis ist schon erteilt, wird beim ersten Tippen still erneuert
        const once = ()=>{ DeviceMotionEvent.requestPermission().then(r=>{ if(r === "granted") startMotion(); }).catch(()=>{}); removeEventListener("touchend", once); };
        addEventListener("touchend", once);
      } else {
        motionBtn.hidden = false;
      }
      motionBtn.addEventListener("click", ()=>{
        DeviceMotionEvent.requestPermission().then(r=>{
          if(r === "granted"){ try{ localStorage.setItem("advent-motion","ja"); }catch(e){} startMotion(); shake(); }
          else { motionBtn.hidden = true; toast("Schade! Du kannst auch auf den Sockel tippen."); }
        }).catch(()=>{ motionBtn.hidden = true; });
      });
    } else {
      startMotion();
    }
  }

  const back = document.getElementById("globeBack"), hint = document.getElementById("globeHint");
  const isSmall = () => matchMedia("(max-width:820px), (max-aspect-ratio:1/1)").matches;
  if(!motionOn) hint.textContent = isSmall() ? "Tipp auf die Kugel, um hineinzuschauen" : "Klick auf die Kugel, um hineinzuschauen · auf den Sockel, um sie zu schütteln";
  function enter(){
    wrap.classList.add("zoomed"); document.body.classList.add("zoomed-on"); back.hidden = false;
    requestAnimationFrame(()=>{
      const sc = globe.querySelector(".scene"), st = sc.querySelector(".stage");
      if(sc.scrollWidth > sc.clientWidth + 4) sc.scrollLeft = st.clientWidth * .494 - sc.clientWidth / 2;
      try{ alignViews(); }catch(e){}
    });
    setTimeout(()=>{ try{ alignViews(); }catch(e){} }, 600);
  }
  function leave(){
    wrap.classList.remove("zoomed"); document.body.classList.remove("zoomed-on"); back.hidden = true;
    requestAnimationFrame(()=>{ try{ alignViews(); }catch(e){} size(); });
  }
  window.globeEnter = enter;
  document.getElementById("globeEnter").addEventListener("click", enter);
  back.addEventListener("click", leave);
  document.addEventListener("keydown", e=>{ if(e.key === "Escape" && wrap.classList.contains("zoomed") && scrim.hidden) leave(); });
  setTimeout(shake, 900);
})();

/* Fenster zeigen genau den Ausschnitt des Hintergrunds, der dahinter liegt */
function alignViews(){
  // Der Ausblick wird an der Größe des Treppenhauses gemessen, nicht am Bildschirm.
  // So sieht er in der kleinen Kugel genauso aus wie hineingezoomt.
  document.querySelectorAll(".view").forEach(v=>{
    const r = v.getBoundingClientRect();
    const st = (v.closest(".stage") || document.body).getBoundingClientRect();
    // kleiner Ausschnitt der Welt: das Bild liegt verkleinert hinter den Fenstern (rechte obere Hälfte des Treppenhauses)
    let W = st.width * .8, H = st.height * .62, L = st.left + st.width * .2, T = st.top - st.height * .03;
    // In der Schneekugel: durch die Fenster sieht man genau die Welt, die hinter der Kugel liegt
    const wrapEl = document.getElementById("globeWrap");
    const zoomedIn = !wrapEl || wrapEl.classList.contains("zoomed");
    if(!zoomedIn){ W = innerWidth; H = innerHeight; L = 0; T = 0; }
    let fz = null;
    for(const d in TUERCHEN){ if(TUERCHEN[d].bild && TUERCHEN[d].bild === bgCurrent && TUERCHEN[d].fenster){ fz = TUERCHEN[d].fenster; break; } }
    v.querySelectorAll(".layer").forEach(l=>{ l.style.backgroundSize = (zoomedIn && fz) ? fz[0] : ""; l.style.backgroundPosition = (zoomedIn && fz) ? fz[1] : ""; l.style.inset = "auto"; l.style.left = (L - r.left) + "px"; l.style.top = (T - r.top) + "px"; l.style.width = W + "px"; l.style.height = H + "px"; });
  });
}
alignViews();
addEventListener("resize", alignViews);
addEventListener("scroll", alignViews, {passive:true});
document.querySelector(".scene").addEventListener("scroll", alignViews, {passive:true});

(function(){ const sc = document.querySelector(".scene"); if(sc.scrollWidth > sc.clientWidth + 4){ const st = sc.querySelector(".stage"); sc.scrollLeft = st.clientWidth * 0.5 - sc.clientWidth / 2; } alignViews(); })();
(function(){ const t = todayNum(); if(!t || PREVIEW || seen.has(t)) return;
  const b = grid.querySelector(`.door[data-n="${t}"]`);
  return;
  if(b) setTimeout(()=>b.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center", inline:"center"}), 700); })();
setInterval(()=>{ renderStatus(); refreshDoors(); if(!bgPicked) setBg(homeBg()); }, 60000);
addEventListener("hashchange", ()=>location.reload());
</script>
